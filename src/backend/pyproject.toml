[project]
name = "it-operation-hub-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.162,<0.166",
    "psycopg[binary]>=3.3,<3.4",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn>=0.40,<0.60",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "httpx>=0.28,<0.29",
    "mypy>=1.18,<3",
    "pytest>=9,<10",
    "ruff>=0.14,<0.20",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
