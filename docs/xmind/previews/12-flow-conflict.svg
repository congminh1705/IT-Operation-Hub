<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1750" viewBox="0 0 1600 1750" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW08" data-source-sheet="91e85eb776534206ac966b83e2" data-topic="04599e8e563347efb249a015c4"><title id="title">Luồng hỗ trợ — lỗi, xung đột và retry</title><desc id="desc">Giữ dữ liệu người dùng đang soạn; không tự ghi đè version, phát lại mutation hoặc hiển thị dữ liệu mất quyền.. Thiết kế mục tiêu, chưa triển khai.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW08", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "91e85eb776534206ac966b83e2"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1750" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB  /  FIG-FLOW08</text><text x="56" y="92" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Luồng hỗ trợ — lỗi, xung đột và retry</text><text x="56" y="126" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">Giữ dữ liệu người dùng đang soạn; không tự ghi đè version, phát lại mutation hoặc hiển thị dữ liệu mất quyền.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="send" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="c3a1256f39815793a0d879da746f3b5b"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NGƯỜI DÙNG</text><text x="580" y="296" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Gửi thay đổi / xác nhận</text><text x="580" y="327" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Giữ bản nhập trong bộ nhớ, chống bấm lặp và dùng</text><text x="580" y="350" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">command/idempotency khi áp dụng.</text></g><g class="diagram-decision" data-node="result" data-topic="3efbf897ba8f5f85bc65d59afa1506a3"><polygon points="810,465.0 975.0,540 810,615.0 645.0,540" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,465.0 975.0,540 810,615.0 645.0,540" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="534" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="230.99999999999997">Server trả kết quả</text><text x="810" y="558" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="230.99999999999997">gì?</text></g><g class="diagram-node" data-node="validation" data-x="56" data-y="780" data-width="430" data-height="220" data-topic="0a094d1752d751e5a65c34c0aca335f8"><rect x="54" y="778" width="434" height="224" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="780" width="430" height="220" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="780" width="5" height="220" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="76" y="806" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="390">422 / FIELD ERROR</text><text x="76" y="836" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="390">Validation tại trường</text><text x="76" y="867" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">Giữ form, báo lỗi cụ thể; focus trường</text><text x="76" y="890" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">đầu. Sửa dữ liệu rồi chủ động gửi lại.</text></g><g class="diagram-node" data-node="conflict" data-x="585" data-y="780" data-width="430" data-height="220" data-topic="9cde8efc98265ae88ca7f31c28ea1b70"><rect x="583" y="778" width="434" height="224" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="585" y="780" width="430" height="220" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="585" y="780" width="5" height="220" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="605" y="806" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="390">409 / CONFLICT</text><text x="605" y="836" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="390">Version / snapshot đã cũ</text><text x="605" y="867" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">Giữ nháp; tải bản mới đúng scope và đối</text><text x="605" y="890" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">chiếu. Không hợp nhất hoặc retry âm thầm.</text></g><g class="diagram-node" data-node="auth" data-x="1114" data-y="780" data-width="430" data-height="220" data-topic="cc445b6465cc5f38a8c728b37f78d667"><rect x="1112" y="778" width="434" height="224" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1114" y="780" width="430" height="220" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1114" y="780" width="5" height="220" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1134" y="806" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="390">401 / 403 / 404 SCOPED</text><text x="1134" y="836" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="390">Hết phiên / mất quyền</text><text x="1134" y="867" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">Che dữ liệu server đang bảo vệ; về đăng</text><text x="1134" y="890" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">nhập/trang an toàn. Chỉ giữ nội dung</text><text x="1134" y="913" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">người dùng tự soạn.</text></g><g class="diagram-node" data-node="unknown" data-x="56" data-y="1160" data-width="430" data-height="220" data-topic="283b941ec63f56348e3dbd04923135ea"><rect x="54" y="1158" width="434" height="224" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1160" width="430" height="220" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1160" width="5" height="220" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="76" y="1186" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="390">TIMEOUT / UNKNOWN</text><text x="76" y="1216" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="390">Mạng chưa rõ kết quả</text><text x="76" y="1247" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">Kiểm tra resource/command result trước</text><text x="76" y="1270" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">retry; cùng intent không nhân đôi</text><text x="76" y="1293" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">ticket/comment/action.</text></g><g class="diagram-node" data-node="success" data-x="1114" data-y="1160" data-width="430" data-height="220" data-topic="2db6fd3da21856f99c2a970340df0287"><rect x="1112" y="1158" width="434" height="224" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1114" y="1160" width="430" height="220" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1114" y="1160" width="5" height="220" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="1134" y="1186" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="390">2XX THEO HỢP ĐỒNG</text><text x="1134" y="1216" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="390">Đã commit thành công</text><text x="1134" y="1247" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">Refresh dữ liệu ảnh hưởng, hiển thị kết</text><text x="1134" y="1270" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">quả, trả focus hợp lý. Chưa có commit thì</text><text x="1134" y="1293" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">không báo thành công.</text></g><g class="diagram-node" data-node="return" data-x="560" data-y="1490" data-width="500" data-height="130" data-topic="290ddd0b39e45cb1a23ff6276305066c"><rect x="558" y="1488" width="504" height="134" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1490" width="500" height="130" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1490" width="5" height="130" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1516" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NGƯỜI DÙNG / SERVER</text><text x="580" y="1546" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Tiếp tục bằng trạng thái hiện tại</text><text x="580" y="1577" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Recheck quyền và version trước mọi mutation tiếp</text><text x="580" y="1600" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">theo.</text></g><path d="M 810 390 L 810 465" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="c3a1256f39815793a0d879da746f3b5b" data-to="3efbf897ba8f5f85bc65d59afa1506a3" /><path d="M 645 540 L 271 540 L 271 780" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="3efbf897ba8f5f85bc65d59afa1506a3" data-to="0a094d1752d751e5a65c34c0aca335f8" /><rect x="293" y="489" width="119.0" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="300" y="507" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="105.0">Lỗi trường</text><path d="M 810 615 L 810 780" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="3efbf897ba8f5f85bc65d59afa1506a3" data-to="9cde8efc98265ae88ca7f31c28ea1b70" /><rect x="827" y="680" width="98.0" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="698" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="84.0">Xung đột</text><path d="M 975 540 L 1329 540 L 1329 780" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="3efbf897ba8f5f85bc65d59afa1506a3" data-to="cc445b6465cc5f38a8c728b37f78d667" /><rect x="1043" y="489" width="129.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1050" y="507" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="115.5">Phiên/quyền</text><path d="M 670 600 L 528 600 L 528 1270 L 486 1270" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="3efbf897ba8f5f85bc65d59afa1506a3" data-to="283b941ec63f56348e3dbd04923135ea" /><rect x="353" y="1100" width="171.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="360" y="1118" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="157.5">Chưa rõ kết quả</text><path d="M 950 600 L 1062 600 L 1062 1270 L 1114 1270" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="3efbf897ba8f5f85bc65d59afa1506a3" data-to="2db6fd3da21856f99c2a970340df0287" /><rect x="1073" y="1100" width="77.0" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1080" y="1118" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="63.0">Đã lưu</text><path d="M 56 890 L 32 890 L 32 1545 L 560 1545" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="0a094d1752d751e5a65c34c0aca335f8" data-to="290ddd0b39e45cb1a23ff6276305066c" /><path d="M 800 1000 L 800 1490" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="9cde8efc98265ae88ca7f31c28ea1b70" data-to="290ddd0b39e45cb1a23ff6276305066c" /><path d="M 1329 1000 L 1570 1000 L 1570 1545 L 1060 1545" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="cc445b6465cc5f38a8c728b37f78d667" data-to="290ddd0b39e45cb1a23ff6276305066c" /><path d="M 271 1380 L 271 1545 L 560 1545" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="283b941ec63f56348e3dbd04923135ea" data-to="290ddd0b39e45cb1a23ff6276305066c" /><path d="M 1329 1380 L 1329 1545 L 1060 1545" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="2db6fd3da21856f99c2a970340df0287" data-to="290ddd0b39e45cb1a23ff6276305066c" /><path d="M 56 1656 L 1544 1656" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1688" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Nguồn: NFR01/02/03/07/15/19/21 · Outbox retry hữu hạn; stale approval cần đánh giá mới, không ép snapshot cũ</text><text x="56" y="1718" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Thiết kế mục tiêu • Chưa triển khai • Giá trị vận hành/nhánh chưa chốt được ghi tại D-40</text></g></svg>