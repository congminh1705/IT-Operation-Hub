<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW07" data-source-sheet="5a1296bcc1484920b2f4cc2b41" data-topic="52feac72fff042a4995689dd4f"><title id="title">Administration flow</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW07", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "5a1296bcc1484920b2f4cc2b41", "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW07</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Supporting flow — access, sessions, handover</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">Admin-only user/role/membership changes • No unauthorized assignees or precommit lock success.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="user" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="cdd4955cad1c522d90c3e3de94a998ac"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">ADMIN</text><text x="580" y="296.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Open current user / member</text><text x="580" y="327.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Check role, state, team scope, and open assignments.</text></g><g class="diagram-node" data-node="impact" data-x="560" data-y="470" data-width="500" data-height="174" data-topic="923a3835ca315594911973edad98549f"><rect x="558" y="468" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="470" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="470" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="496.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">ADMIN + DOMAIN SERVICES</text><text x="580" y="526.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Review and prepare handover</text><text x="580" y="557.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">In Progress/Pending needs an eligible replacement; preserve</text><text x="580" y="580.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">task dependencies/capacity and handle locks/in-progress</text><text x="580" y="603.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">work.</text></g><g class="diagram-decision" data-node="ready" data-topic="08231f14f9005da784b790849219d001"><polygon points="810,720.0 975.0,790 810,860.0 645.0,790" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,720.0 975.0,790 810,860.0 645.0,790" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="796.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="230.99999999999997">Eligible and authorized?</text></g><g class="diagram-node" data-node="unresolved" data-x="1160" data-y="700" data-width="380" data-height="220" data-topic="1ae4e58d0fa659ce9256f6610cfd0cd2"><rect x="1158" y="698" width="384" height="224" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="700" width="380" height="220" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="700" width="5" height="220" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="726.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">UNRESOLVED EXCEPTION</text><text x="1180" y="756.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">No false success</text><text x="1180" y="787.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">No eligible replacement or last-Admin risk</text><text x="1180" y="810.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">blocks invalid change. Emergency</text><text x="1180" y="833.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">revocation/handover requires D-40</text><text x="1180" y="856.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">refinement.</text></g><g class="diagram-node" data-node="confirm" data-x="560" data-y="960" data-width="500" data-height="174" data-topic="98658a00aa4c5cee9d61506ddc847cd1"><rect x="558" y="958" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="960" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="960" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="986.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">ADMIN / SERVER</text><text x="580" y="1016.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Confirm versioned changes</text><text x="580" y="1047.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Recheck account/membership and affected assignments;</text><text x="580" y="1070.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">never disable the last active Admin.</text></g><g class="diagram-node" data-node="commit" data-x="560" data-y="1220" data-width="500" data-height="174" data-topic="dd615b34333852deb042aea87ac081b3"><rect x="558" y="1218" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1220" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1220" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1246.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN TRANSACTION</text><text x="580" y="1276.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Commit change + revocation + audit</text><text x="580" y="1307.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Committed revocation takes effect immediately; apply</text><text x="580" y="1330.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">consistent updates/handover.</text></g><g class="diagram-node" data-node="verify" data-x="560" data-y="1480" data-width="500" data-height="174" data-topic="5f5514a461b059d2a5029fa73a7837b4"><rect x="558" y="1478" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1480" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1480" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1506.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">SERVER / ADMIN</text><text x="580" y="1536.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Recheck access on next request</text><text x="580" y="1567.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Old sessions/teams lose read/write access; evaluate affected</text><text x="580" y="1590.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">tasks. Preserve history, no secret logs.</text></g><path d="M 810 390 L 810 470" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="cdd4955cad1c522d90c3e3de94a998ac" data-to="923a3835ca315594911973edad98549f" /><path d="M 810 644 L 810 720" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="923a3835ca315594911973edad98549f" data-to="08231f14f9005da784b790849219d001" /><path d="M 975 790 L 1160 790" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="08231f14f9005da784b790849219d001" data-to="1ae4e58d0fa659ce9256f6610cfd0cd2" /><rect x="993" y="734" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1000" y="752.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">No</text><path d="M 810 860 L 810 960" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="08231f14f9005da784b790849219d001" data-to="98658a00aa4c5cee9d61506ddc847cd1" /><rect x="827" y="892" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="910.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Yes</text><path d="M 810 1134 L 810 1220" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="98658a00aa4c5cee9d61506ddc847cd1" data-to="dd615b34333852deb042aea87ac081b3" /><path d="M 810 1394 L 810 1480" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="dd615b34333852deb042aea87ac081b3" data-to="5f5514a461b059d2a5029fa73a7837b4" /><path d="M 56 1706 L 1544 1706" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1738.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: BR-01/05/12 · D-12/17/40 · Decide emergency revocation without handover before implementation</text><text x="56" y="1768.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Target design • Not implemented • Open operational values/branches recorded in D-40</text></g></svg>