ke="none" stroke-width="0" /><text x="834" y="1780" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Có</text><path d="M 965 1680 L 1160 1680" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="d70972152d4b5a719bd3aa863969ff1c" data-to="72f29bd71ed85990b13d52f6adb3f515" /><rect x="993" y="1629" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1000" y="1647" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Chưa</text><path d="M 1540 1690 L 1570 1690 L 1570 1070 L 1060 1070" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="72f29bd71ed85990b13d52f6adb3f515" data-to="8c8bce8cd8af5b5cad52472159a7ee6c" /><rect x="1113" y="1018" width="294" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1120" y="1036" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="280">Lý do; version/assignee hợp lệ</text><path d="M 56 2066 L 1544 2066" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="2098" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Nguồn: BR-04/08–10/14–20 · UC10/18–21 · SCR21/22/24/AI02 · Không biến sơ đồ thành quyền đọc nội bộ</text><text x="56" y="2128" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Thiết kế mục tiêu • Chưa triển khai • Giá trị vận hành/nhánh chưa chốt được ghi tại D-40</text></g></svg>