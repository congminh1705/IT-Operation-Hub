<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2160" viewBox="0 0 1600 2160" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW03" data-source-sheet="cef3eed33d2a432691625eaeeb" data-topic="a02907331f5a48d386683a6c1f"><title id="title">Requester flow</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW03", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "cef3eed33d2a432691625eaeeb", "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="2160" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW03</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Primary flow — request submission and acceptance</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">All roles may submit personal requests • AI coordinates by policy; IT humans execute specialist work.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="send" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="da89fc06893c5aeea27d49a5979923fa"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">REQUESTER</text><text x="580" y="296.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Submit request / confirm draft</text><text x="580" y="327.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">SCR21 form or conversational preview/confirmation. No</text><text x="580" y="350.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">confirmation, no ticket.</text></g><g class="diagram-node" data-node="save" data-x="560" data-y="470" data-width="500" data-height="150" data-topic="0f14f46daa8555a99db154c07cafcc1b"><rect x="558" y="468" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="470" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="470" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="496.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">TICKET SERVICE</text><text x="580" y="526.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Save New ticket</text><text x="580" y="557.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Session requester, tracking code, intake team, SLA snapshot,</text><text x="580" y="580.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">event/outbox.</text></g><g class="diagram-node" data-node="ai" data-x="560" data-y="700" data-width="500" data-height="174" data-topic="f8b224626f685464b65053bfdfde68b9"><rect x="558" y="698" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="700" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="700" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="726.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">AI + DOMAIN SERVICES</text><text x="580" y="756.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Controlled planning and assignment</text><text x="580" y="787.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Valid sources/candidates/schedules/load/DAG/policy.</text><text x="580" y="810.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Missing grants/resources lead to drafts/exceptions, never</text><text x="580" y="833.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">forced assignment.</text></g><g class="diagram-node" data-node="it" data-x="560" data-y="982" data-width="500" data-height="174" data-topic="8c8bce8cd8af5b5cad52472159a7ee6c"><rect x="558" y="980" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="982" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="982" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1008.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">TECHNICIAN / AUTHORIZED IT</text><text x="580" y="1038.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">IT accepts and executes</text><text x="580" y="1069.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Authorized Ticket New→Open→In Progress. Separate Task</text><text x="580" y="1092.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">lifecycle; dependencies guard start.</text></g><g class="diagram-decision" data-node="needinfo" data-topic="d479ac2353c15493ba1c9341873d2af8"><polygon points="810,1195.0 965.0,1260 810,1325.0 655.0,1260" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1195.0 965.0,1260 810,1325.0 655.0,1260" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1254.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Need requester</text><text x="810" y="1278.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">information?</text></g><g class="diagram-node" data-node="info" data-x="56" data-y="1178" data-width="380" data-height="194" data-topic="eee97c995b2f54ff919f48ade389818b"><rect x="54" y="1176" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1178" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1178" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="76" y="1204.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">ASSIGNEE / REQUESTER</text><text x="76" y="1234.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Public questions and replies</text><text x="76" y="1265.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">IT question: In Progress → Pending.</text><text x="76" y="1288.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Substantive public requester reply resumes</text><text x="76" y="1311.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">In Progress.</text></g><g class="diagram-node" data-node="solution" data-x="560" data-y="1400" data-width="500" data-height="150" data-topic="d928c8532acb545d8bdcb2cc0972007b"><rect x="558" y="1398" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1400" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1400" width="5" height="150" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1426.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">AUTHORIZED IT</text><text x="580" y="1456.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Propose resolution</text><text x="580" y="1487.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Public IT solution → Resolved. Task Done never automatically</text><text x="580" y="1510.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">sets Resolved/Closed.</text></g><g class="diagram-decision" data-node="accepted" data-topic="d70972152d4b5a719bd3aa863969ff1c"><polygon points="810,1612.0 965.0,1680 810,1748.0 655.0,1680" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1612.0 965.0,1680 810,1748.0 655.0,1680" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1686.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Outcome satisfactory?</text></g><g class="diagram-node" data-node="close" data-x="560" data-y="1820" data-width="500" data-height="150" data-topic="cfd21c415c595d92b72c127976e9dfbd"><rect x="558" y="1818" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1820" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1820" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1846.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">REQUESTER</text><text x="580" y="1876.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Confirm Closed</text><text x="580" y="1907.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Original requester confirms. Preserve history; Closed</text><text x="580" y="1930.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">reopening needs M/A and reason.</text></g><g class="diagram-node" data-node="reopen" data-x="1160" data-y="1600" data-width="380" data-height="194" data-topic="72f29bd71ed85990b13d52f6adb3f515"><rect x="1158" y="1598" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1600" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1600" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="1626.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">REQUESTER</text><text x="1180" y="1656.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Request further work</text><text x="1180" y="1687.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Reopen only from Resolved with reason/valid</text><text x="1180" y="1710.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">assignee. Cannot reopen Closed.</text></g><g class="diagram-node" data-node="privacy" data-x="1160" data-y="700" data-width="380" data-height="194" data-topic="955f95c718a75972989da3867a0bbfa8"><rect x="1158" y="698" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="700" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="700" width="5" height="194" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="1180" y="726.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">DISPLAY BOUNDARY</text><text x="1180" y="756.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Public progress only</text><text x="1180" y="787.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Requester sees no workforce</text><text x="1180" y="810.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">plans/schedules/load/internal</text><text x="1180" y="833.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">notes/approvals. AI chat is not first response.</text></g><path d="M 810 390 L 810 470" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="da89fc06893c5aeea27d49a5979923fa" data-to="0f14f46daa8555a99db154c07cafcc1b" /><path d="M 810 620 L 810 700" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="0f14f46daa8555a99db154c07cafcc1b" data-to="f8b224626f685464b65053bfdfde68b9" /><path d="M 810 874 L 810 982" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="f8b224626f685464b65053bfdfde68b9" data-to="8c8bce8cd8af5b5cad52472159a7ee6c" /><path d="M 810 1156 L 810 1195" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="8c8bce8cd8af5b5cad52472159a7ee6c" data-to="d479ac2353c15493ba1c9341873d2af8" /><path d="M 655 1260 L 436 1260" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="d479ac2353c15493ba1c9341873d2af8" data-to="eee97c995b2f54ff919f48ade389818b" /><rect x="463" y="1209" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="470" y="1227.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Yes</text><path d="M 56 1280 L 32 1280 L 32 1070 L 560 1070" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="eee97c995b2f54ff919f48ade389818b" data-to="8c8bce8cd8af5b5cad52472159a7ee6c" /><rect x="63" y="1022" width="119.0" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="70" y="1040.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="105.0">Information</text><text x="70" y="1060.8" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="105.0">added</text><path d="M 810 1325 L 810 1400" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="d479ac2353c15493ba1c9341873d2af8" data-to="d928c8532acb545d8bdcb2cc0972007b" /><rect x="827" y="1352" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="1370.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">No</text><path d="M 810 1550 L 810 1612" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="d928c8532acb545d8bdcb2cc0972007b" data-to="d70972152d4b5a719bd3aa863969ff1c" /><path d="M 810 1748 L 810 1820" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="d70972152d4b5a719bd3aa863969ff1c" data-to="cfd21c415c595d92b72c127976e9dfbd" /><rect x="827" y="1762" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="1780.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Yes</text><path d="M 965 1680 L 1160 1680" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="d70972152d4b5a719bd3aa863969ff1c" data-to="72f29bd71ed85990b13d52f6adb3f515" /><rect x="993" y="1629" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1000" y="1647.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Not</text><text x="1000" y="1667.8" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">yet</text><path d="M 1540 1690 L 1570 1690 L 1570 1070 L 1060 1070" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="72f29bd71ed85990b13d52f6adb3f515" data-to="8c8bce8cd8af5b5cad52472159a7ee6c" /><rect x="1113" y="1018" width="294" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1120" y="1036.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="280">Reason; valid version/assignee</text><path d="M 56 2066 L 1544 2066" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="2098.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: BR-04/08–10/14–20 · UC10/18–21 · SCR21/22/24/AI02 · Diagrams grant no internal access</text><text x="56" y="2128.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Target design • Not implemented • Open operational values/branches recorded in D-40</text></g></svg>