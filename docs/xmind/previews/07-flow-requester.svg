<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2160" viewBox="0 0 1600 2160" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW03" data-source-sheet="cef3eed33d2a432691625eaeeb" data-topic="a02907331f5a48d386683a6c1f"><title id="title">Primary flow — gửi và nghiệm thu yêu cầu</title><desc id="desc">R/T/M/A có thể gửi yêu cầu cá nhân • AI điều phối theo policy; nhân sự IT xử lý chuyên môn.. Thiết kế mục tiêu, chưa triển khai.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW03", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "cef3eed33d2a432691625eaeeb"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="2160" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB  /  FIG-FLOW03</text><text x="56" y="92" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Primary flow — gửi và nghiệm thu yêu cầu</text><text x="56" y="126" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">R/T/M/A có thể gửi yêu cầu cá nhân • AI điều phối theo policy; nhân sự IT xử lý chuyên môn.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="send" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="da89fc06893c5aeea27d49a5979923fa"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">REQUESTER</text><text x="580" y="296" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Gửi yêu cầu / xác nhận nháp</text><text x="580" y="327" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Form SCR21 hoặc hội thoại có preview và user</text><text x="580" y="350" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">confirm. Chưa confirm thì chưa tạo ticket.</text></g><g class="diagram-node" data-node="save" data-x="560" data-y="470" data-width="500" data-height="150" data-topic="0f14f46daa8555a99db154c07cafcc1b"><rect x="558" y="468" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="470" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="470" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="496" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">TICKET SERVICE</text><text x="580" y="526" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Lưu ticket New</text><text x="580" y="557" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Requester từ phiên; mã theo dõi, nhóm tiếp nhận,</text><text x="580" y="580" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">snapshot SLA và event/outbox.</text></g><g class="diagram-node" data-node="ai" data-x="560" data-y="700" data-width="500" data-height="174" data-topic="f8b224626f685464b65053bfdfde68b9"><rect x="558" y="698" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="700" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="700" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="726" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">AI + DOMAIN SERVICES</text><text x="580" y="756" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Lập và giao task có kiểm soát</text><text x="580" y="787" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Nguồn hợp lệ, candidates, lịch/tải/DAG và policy.</text><text x="580" y="810" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Thiếu grant/nguồn lực: draft hoặc ngoại lệ; không</text><text x="580" y="833" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">ép giao.</text></g><g class="diagram-node" data-node="it" data-x="560" data-y="982" data-width="500" data-height="174" data-topic="8c8bce8cd8af5b5cad52472159a7ee6c"><rect x="558" y="980" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="982" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="982" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1008" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">TECHNICIAN / IT CÓ QUYỀN</text><text x="580" y="1038" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">IT tiếp nhận và thực hiện</text><text x="580" y="1069" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Ticket: New → Open → In Progress đúng quyền. Task</text><text x="580" y="1092" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">có lifecycle riêng; đủ dependency mới bắt đầu.</text></g><g class="diagram-decision" data-node="needinfo" data-topic="d479ac2353c15493ba1c9341873d2af8"><polygon points="810,1195.0 965.0,1260 810,1325.0 655.0,1260" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1195.0 965.0,1260 810,1325.0 655.0,1260" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1254" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Cần requester bổ</text><text x="810" y="1278" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">sung?</text></g><g class="diagram-node" data-node="info" data-x="56" data-y="1178" data-width="380" data-height="194" data-topic="eee97c995b2f54ff919f48ade389818b"><rect x="54" y="1176" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1178" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1178" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="76" y="1204" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">ASSIGNEE / REQUESTER</text><text x="76" y="1234" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Hỏi và trả lời công khai</text><text x="76" y="1265" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">IT hỏi: In Progress → Pending.</text><text x="76" y="1288" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Requester reply public có nội dung:</text><text x="76" y="1311" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">trở lại In Progress.</text></g><g class="diagram-node" data-node="solution" data-x="560" data-y="1400" data-width="500" data-height="150" data-topic="d928c8532acb545d8bdcb2cc0972007b"><rect x="558" y="1398" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1400" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1400" width="5" height="150" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1426" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">IT CÓ QUYỀN</text><text x="580" y="1456" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Đề xuất giải quyết</text><text x="580" y="1487" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">IT gửi giải pháp public → Resolved. Task Done</text><text x="580" y="1510" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">không tự tạo Resolved/Closed.</text></g><g class="diagram-decision" data-node="accepted" data-topic="d70972152d4b5a719bd3aa863969ff1c"><polygon points="810,1612.0 965.0,1680 810,1748.0 655.0,1680" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1612.0 965.0,1680 810,1748.0 655.0,1680" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1686" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Kết quả đã đáp ứng?</text></g><g class="diagram-node" data-node="close" data-x="560" data-y="1820" data-width="500" data-height="150" data-topic="cfd21c415c595d92b72c127976e9dfbd"><rect x="558" y="1818" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1820" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1820" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1846" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">REQUESTER</text><text x="580" y="1876" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Xác nhận Closed</text><text x="580" y="1907" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Chính requester xác nhận. Giữ lịch sử; Closed chỉ</text><text x="580" y="1930" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">M/A mở lại có lý do.</text></g><g class="diagram-node" data-node="reopen" data-x="1160" data-y="1600" data-width="380" data-height="194" data-topic="72f29bd71ed85990b13d52f6adb3f515"><rect x="1158" y="1598" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1600" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1600" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="1626" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">REQUESTER</text><text x="1180" y="1656" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Yêu cầu xử lý lại</text><text x="1180" y="1687" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Requester chỉ mở lại từ Resolved; có</text><text x="1180" y="1710" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">lý do và assignee hợp lệ. Không tự</text><text x="1180" y="1733" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">mở lại Closed.</text></g><g class="diagram-node" data-node="privacy" data-x="1160" data-y="700" data-width="380" data-height="194" data-topic="955f95c718a75972989da3867a0bbfa8"><rect x="1158" y="698" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="700" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="700" width="5" height="194" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="1180" y="726" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">GIỚI HẠN HIỂN THỊ</text><text x="1180" y="756" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Chỉ tiến độ công khai</text><text x="1180" y="787" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Requester không đọc plan nhân lực,</text><text x="1180" y="810" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">lịch/tải, note nội bộ hoặc approval.</text><text x="1180" y="833" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Chat AI không là first response.</text></g><path d="M 810 390 L 810 470" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="da89fc06893c5aeea27d49a5979923fa" data-to="0f14f46daa8555a99db154c07cafcc1b" /><path d="M 810 620 L 810 700" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="0f14f46daa8555a99db154c07cafcc1b" data-to="f8b224626f685464b65053bfdfde68b9" /><path d="M 810 874 L 810 982" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="f8b224626f685464b65053bfdfde68b9" data-to="8c8bce8cd8af5b5cad52472159a7ee6c" /><path d="M 810 1156 L 810 1195" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="8c8bce8cd8af5b5cad52472159a7ee6c" data-to="d