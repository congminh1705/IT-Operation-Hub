<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1890" viewBox="0 0 1600 1890" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW09" data-source-sheet="3cbbd9f486a84007bbbb32cd00" data-topic="6ca33c2a66d34ad78c4b69295a"><title id="title">Luồng hỗ trợ — thông báo đúng người, đúng quyền</title><desc id="desc">Thông báo trong ứng dụng • Không gửi note nội bộ cho requester; không coi snapshot cũ là quyền truy cập hiện tại.. Thiết kế mục tiêu, chưa triển khai.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW09", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "3cbbd9f486a84007bbbb32cd00"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1890" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB  /  FIG-FLOW09</text><text x="56" y="92" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Luồng hỗ trợ — thông báo đúng người, đúng quyền</text><text x="56" y="126" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">Thông báo trong ứng dụng • Không gửi note nội bộ cho requester; không coi snapshot cũ là quyền truy cập hiện tại.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="event" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="8b98f072a4005963af9bec74c31ef27d"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN / OUTBOX</text><text x="580" y="296" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Nhận event nghiệp vụ</text><text x="580" y="327" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Phân công/comment/trạng thái/cảnh báo/automation</text><text x="580" y="350" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">từ dữ liệu đã commit.</text></g><g class="diagram-node" data-node="scope" data-x="560" data-y="470" data-width="500" data-height="174" data-topic="3c2bbacf1720566bb10df170201427a1"><rect x="558" y="468" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="470" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="470" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="496" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NOTIFICATION SERVICE</text><text x="580" y="526" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Chọn người nhận còn quyền</text><text x="580" y="557" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Recipient theo business rule và visibility; loại</text><text x="580" y="580" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">chính actor khi áp dụng; không mở rộng theo cùng</text><text x="580" y="603" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">phòng ban.</text></g><g class="diagram-node" data-node="save" data-x="560" data-y="730" data-width="500" data-height="174" data-topic="42ac5743fa2c5b7895d773c92404de84"><rect x="558" y="728" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="730" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="730" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="756" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NOTIFICATION SERVICE</text><text x="580" y="786" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Ghi chống trùng và hiển thị</text><text x="580" y="817" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Event + recipient + type; badge/list chỉ của</text><text x="580" y="840" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">người nhận. Replay không tạo thêm thông báo cùng</text><text x="580" y="863" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">effect.</text></g><g class="diagram-node" data-node="open" data-x="560" data-y="990" data-width="500" data-height="150" data-topic="982f1ee578455acdbab4ae3000c45940"><rect x="558" y="988" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="990" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="990" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1016" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NGƯỜI NHẬN</text><text x="580" y="1046" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Người nhận mở thông báo</text><text x="580" y="1077" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Kiểm quyền hiện tại của notification và tài</text><text x="580" y="1100" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">nguyên được trỏ tới; không đọc lại payload riêng</text><text x="580" y="1123" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">tư cũ.</text></g><g class="diagram-decision" data-node="access" data-topic="ef5c0f56b149581ea3699b24c5c491e3"><polygon points="810,1190.0 975.0,1260 810,1330.0 645.0,1260" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1190.0 975.0,1260 810,1330.0 645.0,1260" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1254" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="230.99999999999997">Còn quyền đọc nội</text><text x="810" y="1278" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="230.99999999999997">dung?</text></g><g class="diagram-node" data-node="redact" data-x="56" data-y="1170" data-width="380" data-height="194" data-topic="b0004cec7f1b5c09a1af40c1c02767de"><rect x="54" y="1168" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1170" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1170" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="76" y="1196" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">KHÔNG CÒN QUYỀN</text><text x="76" y="1226" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Hiển thị chung / không mở bản</text><text x="76" y="1253" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">ghi</text><text x="76" y="1284" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Không lộ tiêu đề, note hoặc plan;</text><text x="76" y="1307" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">chuyển phản hồi không tìm thấy/ngoài</text><text x="76" y="1330" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">scope theo hợp đồng.</text></g><g class="diagram-node" data-node="view" data-x="1160" data-y="1170" data-width="380" data-height="194" data-topic="f5b308b676b75c28a19c2ca5c93143ab"><rect x="1158" y="1168" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1170" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1170" width="5" height="194" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="1180" y="1196" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">CÒN QUYỀN</text><text x="1180" y="1226" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Mở nội dung đúng scope</text><text x="1180" y="1257" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Ticket, nguồn KB hoặc vùng công việc</text><text x="1180" y="1280" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">theo quyền hiện hành; chỉ projection</text><text x="1180" y="1303" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">người xem được phép.</text></g><g class="diagram-node" data-node="read" data-x="560" data-y="1510" data-width="500" data-height="174" data-topic="fc2b1cab43ab53b39435ceeed309a784"><rect x="558" y="1508" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1510" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1510" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1536" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NGƯỜI NHẬN / SERVICE</text><text x="580" y="1566" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Đánh dấu đã đọc của mình</text><text x="580" y="1597" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Chỉ readAt của đúng recipient; không sửa</text><text x="580" y="1620" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">notification người khác hoặc thay đổi trạng thái</text><text x="580" y="1643" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">ticket.</text></g><path d="M 810 390 L 810 470" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="8b98f072a4005963af9bec74c31ef27d" data-to="3c2bbacf1720566bb10df170201427a1" /><path d="M 810 644 L 810 730" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="3c2bbacf1720566bb10df170201427a1" data-to="42ac5743fa2c5b7895d773c92404de84" /><path d="M 810 904 L 810 990" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="42ac5743fa2c5b7895d773c92404de84" data-to="982f1ee578455acdbab4ae3000c45940" /><path d="M 810 1140 L 810 1190" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="982f1ee578455acdbab4ae3000c45940" data-to="ef5c0f56b149581ea3699b24c5c491e3" /><path d="M 645 1260 L 436 1260" fill="none" stroke="#2457C5" stroke-width="2.6" s