<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1890" viewBox="0 0 1600 1890" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW09" data-source-sheet="3cbbd9f486a84007bbbb32cd00" data-topic="6ca33c2a66d34ad78c4b69295a"><title id="title">Notification flow</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW09", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "3cbbd9f486a84007bbbb32cd00", "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1890" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW09</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Supporting flow — authorized notifications</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">In-app notifications • No internal notes to requester; old snapshots do not grant current access.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="event" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="8b98f072a4005963af9bec74c31ef27d"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN / OUTBOX</text><text x="580" y="296.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Receive business event</text><text x="580" y="327.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Assignments/comments/states/alerts/automation derive</text><text x="580" y="350.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">from committed source records.</text></g><g class="diagram-node" data-node="scope" data-x="560" data-y="470" data-width="500" data-height="174" data-topic="3c2bbacf1720566bb10df170201427a1"><rect x="558" y="468" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="470" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="470" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="496.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NOTIFICATION SERVICE</text><text x="580" y="526.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Select currently authorized recipients</text><text x="580" y="557.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Recipients follow rules/visibility, excluding actor where</text><text x="580" y="580.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">applicable; same department grants no expansion.</text></g><g class="diagram-node" data-node="save" data-x="560" data-y="730" data-width="500" data-height="174" data-topic="42ac5743fa2c5b7895d773c92404de84"><rect x="558" y="728" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="730" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="730" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="756.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">NOTIFICATION SERVICE</text><text x="580" y="786.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Persist deduplicated notification and display</text><text x="580" y="817.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Event+recipient+type; recipient-only badge/list. Replay</text><text x="580" y="840.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">creates no duplicate effect notifications.</text></g><g class="diagram-node" data-node="open" data-x="560" data-y="990" data-width="500" data-height="150" data-topic="982f1ee578455acdbab4ae3000c45940"><rect x="558" y="988" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="990" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="990" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1016.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">RECIPIENT</text><text x="580" y="1046.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Recipient opens notification</text><text x="580" y="1077.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Check notification/current target rights; never reopen old</text><text x="580" y="1100.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">private payloads.</text></g><g class="diagram-decision" data-node="access" data-topic="ef5c0f56b149581ea3699b24c5c491e3"><polygon points="810,1190.0 975.0,1260 810,1330.0 645.0,1260" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1190.0 975.0,1260 810,1330.0 645.0,1260" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1266.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="230.99999999999997">Still authorized to read?</text></g><g class="diagram-node" data-node="redact" data-x="56" data-y="1170" data-width="380" data-height="194" data-topic="b0004cec7f1b5c09a1af40c1c02767de"><rect x="54" y="1168" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1170" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1170" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="76" y="1196.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">ACCESS REVOKED</text><text x="76" y="1226.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Generic display / no record access</text><text x="76" y="1257.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">No titles/notes/plans disclosed. Return</text><text x="76" y="1280.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">contract-defined missing/out-of-scope</text><text x="76" y="1303.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">response.</text></g><g class="diagram-node" data-node="view" data-x="1160" data-y="1170" data-width="380" data-height="194" data-topic="f5b308b676b75c28a19c2ca5c93143ab"><rect x="1158" y="1168" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1170" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1170" width="5" height="194" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="1180" y="1196.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">AUTHORIZED</text><text x="1180" y="1226.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Open content within scope</text><text x="1180" y="1257.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Read ticket/KB/work data under current</text><text x="1180" y="1280.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">permissions, returning only the viewer's</text><text x="1180" y="1303.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">authorized projection.</text></g><g class="diagram-node" data-node="read" data-x="560" data-y="1510" data-width="500" data-height="174" data-topic="fc2b1cab43ab53b39435ceeed309a784"><rect x="558" y="1508" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1510" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1510" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1536.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">RECIPIENT / SERVICE</text><text x="580" y="1566.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Mark own notification read</text><text x="580" y="1597.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Only the correct recipient's readAt changes, not others'</text><text x="580" y="1620.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">notifications or ticket states.</text></g><path d="M 810 390 L 810 470" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="8b98f072a4005963af9bec74c31ef27d" data-to="3c2bbacf1720566bb10df170201427a1" /><path d="M 810 644 L 810 730" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="3c2bbacf1720566bb10df170201427a1" data-to="42ac5743fa2c5b7895d773c92404de84" /><path d="M 810 904 L 810 990" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="42ac5743fa2c5b7895d773c92404de84" data-to="982f1ee578455acdbab4ae3000c45940" /><path d="M 810 1140 L 810 1190" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="982f1ee578455acdbab4ae3000c45940" data-to="ef5c0f56b149581ea3699b24c5c491e3" /><path d="M 645 1260 L 436 1260" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="ef5c0f56b149581ea3699b24c5c491e3" data-to="b0004cec7f1b5c09a1af40c1c02767de" /><rect x="463" y="1210" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="470" y="1228.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">No</text><path d="M 975 1260 L 1160 1260" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="ef5c0f56b149581ea3699b24c5c491e3" data-to="f5b308b676b75c28a19c2ca5c93143ab" /><rect x="1003" y="1210" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1010" y="1228.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Yes</text><path d="M 246 1364 L 246 1440 L 720 1440 L 720 1510" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="b0004cec7f1b5c09a1af40c1c02767de" data-to="fc2b1cab43ab53b39435ceeed309a784" /><path d="M 1350 1364 L 1350 1440 L 900 1440 L 900 1510" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="f5b308b676b75c28a19c2ca5c93143ab" data-to="fc2b1cab43ab53b39435ceeed309a784" /><path d="M 56 1796 L 1544 1796" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1828.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: BR-06/10/12/19 · UC26 / OPS09 · No MVP email; notifications grant no rights or ticket closure</text><text x="56" y="1858.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Target design • Not implemented • Open operational values/branches recorded in D-40</text></g></svg>