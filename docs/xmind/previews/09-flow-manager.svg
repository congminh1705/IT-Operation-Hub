<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2310" viewBox="0 0 1600 2310" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW05" data-source-sheet="0b5d75a4db9b49b8ab3f144d70" data-topic="015eb9629ce04dc2917f0ba76c"><title id="title">Coordination flow</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW05", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "0b5d75a4db9b49b8ab3f144d70", "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="2310" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW05</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Primary flow — IT Manager supervision</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">AI coordinates within grants • IT Manager sets policy, supervises, intervenes, approves; no Team Lead.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="prepare" data-x="560" data-y="240" data-width="500" data-height="174" data-topic="9ab3aeb7f53056fa85224919d19f26e1"><rect x="558" y="238" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="266.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">IT MANAGER</text><text x="580" y="296.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Verify sources and data</text><text x="580" y="327.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Verify skills/schedules/capacity and Published</text><text x="580" y="350.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">workflows/templates. Unconfirmed operational values</text><text x="580" y="373.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">require D-40 decisions.</text></g><g class="diagram-node" data-node="policy" data-x="560" data-y="500" data-width="500" data-height="174" data-topic="242d9d47bc0356e9a3537341a746281a"><rect x="558" y="498" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="500" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="500" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="526.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">AUTHORIZED M/A</text><text x="580" y="556.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Configure / enable bounded policy</text><text x="580" y="587.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Workflow/ team/ actions/ priority/ grantor/ expiry/ limits/</text><text x="580" y="610.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">version. No grant means default deny.</text></g><g class="diagram-node" data-node="watch" data-x="560" data-y="760" data-width="500" data-height="174" data-topic="f73f9ee95764545b9cfec919b1a1eadd"><rect x="558" y="758" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="760" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="760" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="786.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">IT MANAGER</text><text x="580" y="816.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Monitor AI and work</text><text x="580" y="847.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Monitor runs/actions/progress/blockers/schedule/load/SLA</text><text x="580" y="870.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">risk. AI does not wait for each managerial click.</text></g><g class="diagram-decision" data-node="exception" data-topic="9d8438262b8d5be38af0b4110132f4dd"><polygon points="810,985.0 965.0,1050 810,1115.0 655.0,1050" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,985.0 965.0,1050 810,1115.0 655.0,1050" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1044.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Need exception /</text><text x="810" y="1068.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">intervention?</text></g><g class="diagram-node" data-node="continue" data-x="56" data-y="980" data-width="380" data-height="174" data-topic="651e312bbe485bdd813d947a0dd19575"><rect x="54" y="978" width="384" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="980" width="380" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="980" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="76" y="1006.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">NORMAL FLOW</text><text x="76" y="1036.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Continue monitoring</text><text x="76" y="1067.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Without exceptions, monitor source</text><text x="76" y="1090.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">events/results rather than manually reassign</text><text x="76" y="1113.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">every task.</text></g><g class="diagram-node" data-node="review" data-x="560" data-y="1190" data-width="500" data-height="174" data-topic="4489e972f6cd558b8f842c5bced84c4c"><rect x="558" y="1188" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1190" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1190" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="1216.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">AUTHORIZED M/A</text><text x="580" y="1246.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Review proposal and impact</text><text x="580" y="1277.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Review before/after, reason, sources, versions, manual</text><text x="580" y="1300.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">locks/in-progress work, current capacity.</text></g><g class="diagram-decision" data-node="decision" data-topic="1a8300003c5b510d91ffd30c3ee8ef03"><polygon points="810,1420.0 965.0,1485 810,1550.0 655.0,1485" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1420.0 965.0,1485 810,1550.0 655.0,1485" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1491.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Approve proposal?</text></g><g class="diagram-node" data-node="reject" data-x="1160" data-y="1400" data-width="380" data-height="194" data-topic="afeb70b7ada15662ab9fb83c94f3800a"><rect x="1158" y="1398" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1400" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1400" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="1426.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">M/A</text><text x="1180" y="1456.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Reject / adjust resources</text><text x="1180" y="1487.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Retain decisions/audit. Infeasibility requires</text><text x="1180" y="1510.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">separately authorized</text><text x="1180" y="1533.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">resource/policy/commitment changes, never</text><text x="1180" y="1556.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">forced assignment.</text></g><g class="diagram-node" data-node="recheck" data-x="560" data-y="1630" data-width="500" data-height="174" data-topic="1545fc4bc61c595e8a6e9bf43b058dfd"><rect x="558" y="1628" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1630" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1630" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1656.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN SERVICE</text><text x="580" y="1686.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Recheck before every effect</text><text x="580" y="1717.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Current policy/grant/scope/versions/capacity/locks must</text><text x="580" y="1740.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">remain valid. Approved is not Succeeded.</text></g><g class="diagram-decision" data-node="valid" data-topic="8440c185002e5d60895562e3095ae449"><polygon points="810,1845.0 965.0,1910 810,1975.0 655.0,1910" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1845.0 965.0,1910 810,1975.0 655.0,1910" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1904.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Still authorized and</text><text x="810" y="1928.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">feasible?</text></g><g class="diagram-node" data-node="conflict" data-x="1160" data-y="1820" data-width="380" data-height="194" data-topic="88d5ee30cbb15d13aafc409ad3e8c38f"><rect x="1158" y="1818" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1820" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1820" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="1846.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">DOMAIN SERVICE</text><text x="1180" y="1876.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Conflict / re-evaluate</text><text x="1180" y="1907.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Stale/revoked/insufficient capacity: no old</text><text x="1180" y="1930.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">snapshot; create a new proposal, preserve</text><text x="1180" y="1953.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">history.</text></g><g class="diagram-node" data-node="commit" data-x="560" data-y="2050" data-width="500" data-height="150" data-topic="91c985219c6450cfb4c1bf5be83612a9"><rect x="558" y="2048" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="2050" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="2050" width="5" height="150" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="2076.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN SERVICE</text><text x="580" y="2106.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Commit action and continue monitoring</text><text x="580" y="2137.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Atomically record</text><text x="580" y="2160.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">assignment/allocation/action/audit/outbox. IT staff perform</text><text x="580" y="2183.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">specialist work.</text></g><path d="M 810 414 L 810 500" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="9ab3aeb7f53056fa85224919d19f26e1" data-to="242d9d47bc0356e9a3537341a746281a" /><path d="M 810 674 L 810 760" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="242d9d47bc0356e9a3537341a746281a" data-to="f73f9ee95764545b9cfec919b1a1eadd" /><path d="M 810 934 L 810 985" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="f73f9ee95764545b9cfec919b1a1eadd" data-to="9d8438262b8d5be38af0b4110132f4dd" /><path d="M 655 1050 L 436 1050" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="9d8438262b8d5be38af0b4110132f4dd" data-to="651e312bbe485bdd813d947a0dd19575" /><rect x="463" y="1000" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="470" y="1018.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">No</text><path d="M 56 1060 L 32 1060 L 32 848 L 560 848" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="651e312bbe485bdd813d947a0dd19575" data-to="f73f9ee95764545b9cfec919b1a1eadd" /><path d="M 810 1115 L 810 1190" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="9d8438262b8d5be38af0b4110132f4dd" data-to="4489e972f6cd558b8f842c5bced84c4c" /><rect x="827" y="1140" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text 