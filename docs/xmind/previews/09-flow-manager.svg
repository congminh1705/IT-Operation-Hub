<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2310" viewBox="0 0 1600 2310" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW05" data-source-sheet="0b5d75a4db9b49b8ab3f144d70" data-topic="015eb9629ce04dc2917f0ba76c"><title id="title">Primary flow — Trưởng phòng IT giám sát</title><desc id="desc">AI điều phối trong policy đã cấp • Trưởng phòng thiết lập, giám sát, can thiệp và duyệt ngoại lệ; không cấp trưởng nhóm.. Thiết kế mục tiêu, chưa triển khai.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW05", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "0b5d75a4db9b49b8ab3f144d70"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="2310" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB  /  FIG-FLOW05</text><text x="56" y="92" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Primary flow — Trưởng phòng IT giám sát</text><text x="56" y="126" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">AI điều phối trong policy đã cấp • Trưởng phòng thiết lập, giám sát, can thiệp và duyệt ngoại lệ; không cấp trưởng nhóm.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="prepare" data-x="560" data-y="240" data-width="500" data-height="174" data-topic="9ab3aeb7f53056fa85224919d19f26e1"><rect x="558" y="238" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="266" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">TRƯỞNG PHÒNG IT</text><text x="580" y="296" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Xác nhận nguồn và dữ liệu</text><text x="580" y="327" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Kỹ năng/lịch/capacity, workflow/template</text><text x="580" y="350" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Published. Giá trị vận hành chưa chốt phải quyết</text><text x="580" y="373" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">định theo D-40.</text></g><g class="diagram-node" data-node="policy" data-x="560" data-y="500" data-width="500" data-height="174" data-topic="242d9d47bc0356e9a3537341a746281a"><rect x="558" y="498" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="500" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="500" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="526" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A THEO THẨM QUYỀN</text><text x="580" y="556" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Thiết lập / bật policy có giới hạn</text><text x="580" y="587" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Workflow, nhóm, actions, priority, grantor,</text><text x="580" y="610" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">hạn/giới hạn và version. Chưa có grant: default</text><text x="580" y="633" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">deny.</text></g><g class="diagram-node" data-node="watch" data-x="560" data-y="760" data-width="500" data-height="174" data-topic="f73f9ee95764545b9cfec919b1a1eadd"><rect x="558" y="758" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="760" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="760" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="786" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">TRƯỞNG PHÒNG IT</text><text x="580" y="816" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Theo dõi AI và công việc</text><text x="580" y="847" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Run/action, tiến độ, blocked, lịch/tải và nguy cơ</text><text x="580" y="870" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">SLA. AI không chờ quản lý bấm từng bước.</text></g><g class="diagram-decision" data-node="exception" data-topic="9d8438262b8d5be38af0b4110132f4dd"><polygon points="810,985.0 965.0,1050 810,1115.0 655.0,1050" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,985.0 965.0,1050 810,1115.0 655.0,1050" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1044" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Cần ngoại lệ / can</text><text x="810" y="1068" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">thiệp?</text></g><g class="diagram-node" data-node="continue" data-x="56" data-y="980" data-width="380" data-height="174" data-topic="651e312bbe485bdd813d947a0dd19575"><rect x="54" y="978" width="384" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="980" width="380" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="980" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="76" y="1006" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">LUỒNG BÌNH THƯỜNG</text><text x="76" y="1036" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Tiếp tục giám sát</text><text x="76" y="1067" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Không có ngoại lệ: theo dõi events</text><text x="76" y="1090" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">và kết quả từ dữ liệu nguồn, không</text><text x="76" y="1113" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">giao lại thủ công từng việc.</text></g><g class="diagram-node" data-node="review" data-x="560" data-y="1190" data-width="500" data-height="174" data-topic="4489e972f6cd558b8f842c5bced84c4c"><rect x="558" y="1188" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1190" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1190" width="5" height="174" rx="2" fill="#7250AB" stroke="none" stroke-width="0" /><text x="580" y="1216" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A CÓ THẨM QUYỀN</text><text x="580" y="1246" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Xem phương án và tác động</text><text x="580" y="1277" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Before/after, lý do, nguồn, versions, manual</text><text x="580" y="1300" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">lock/đang làm và năng lực hiện hành.</text></g><g class="diagram-decision" data-node="decision" data-topic="1a8300003c5b510d91ffd30c3ee8ef03"><polygon points="810,1420.0 965.0,1485 810,1550.0 655.0,1485" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1420.0 965.0,1485 810,1550.0 655.0,1485" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1479" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Chấp thuận phương</text><text x="810" y="1503" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">án?</text></g><g class="diagram-node" data-node="reject" data-x="1160" data-y="1400" data-width="380" data-height="194" data-topic="afeb70b7ada15662ab9fb83c94f3800a"><rect x="1158" y="1398" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1400" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1400" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="1426" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">M/A</text><text x="1180" y="1456" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Từ chối / điều chỉnh nguồn</text><text x="1180" y="1483" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">lực</text><text x="1180" y="1514" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Giữ decision/audit. Không có nghiệm</text><text x="1180" y="1537" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">thì xử lý nguồn lực/policy/cam kết</text><text x="1180" y="1560" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">bằng quyền riêng; không ép giao.</text></g><g class="diagram-node" data-node="recheck" data-x="560" data-y="1630" data-width="500" data-height="174" data-topic="1545fc4bc61c595e8a6e9bf43b058dfd"><rect x="558" y="1628" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1630" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1630" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1656" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN SERVICE</text><text x="580" y="1686" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Kiểm lại trước mọi effect</text><text x="580" y="1717" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Policy/grant, scope, versions, capacity và lock</text><text x="580" y="1740" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">phải còn hợp lệ. Approved chưa phải Succeeded.</text></g><g class="diagram-decision" data-node="valid" data-topic="8440c185002e5d60895562e3095ae449"><polygon points="810,1845.0 965.0,1910 810,1975.0 655.0,1910" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,1845.0 965.0,1910 810,1975.0 655.0,1910" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="1904" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Còn quyền và khả</text><text x="810" y="1928" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">thi?</text></g><g class="diagram-node" data-node="conflict" data-x="1160" data-y="1820" data-width="380" data-height="194" data-topic="88d5ee30cbb15d13aafc409ad3e8c38f"><rect x="1158" y="1818" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1820" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1820" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="1846" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">DOMAIN SERVICE</text><text x="1180" y="1876" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Conflict / đánh giá mới</text><text x="1180" y="1907" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Stale, revoke hoặc thiếu capacity:</text><text x="1180" y="1930" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">không dùng snapshot cũ; tạo phương</text><text x="1180" y="1953" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">án mới, giữ lịch sử.</text></g><g class="diagram-node" data-node="commit" data-x="560" data-y="2050" data-width="500" data-height="150" data-topic="91c985219c6450cfb4c1bf5be83612a9"><rect x="558" y="2048" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="2050" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="2050" width="5" height="150" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="2076" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN SERVICE</text><text x="580" y="2106" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Commit hành động và theo dõi tiếp</text><text x="580" y="2137" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Assignment/allocation + action + audit/outbox</text><text x="580" y="2160" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">nhất quán. Nhân sự IT thực hiện chuyên môn.</text></g><path d="M 810 414 L 810 500" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="9ab3aeb7f53056fa85224919d19f26e1" data-to="242d9d47bc0356e9a3537341a746281a" /><path d="M 810 674 L 810 760" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="242d9d47bc0356e9a3537341a746281a" data-to="f73f9ee95764545b9cfec919b1a1eadd" /><path d="M 810 934 L 810 985" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="f73f9ee95764545b9cfec919b1a1eadd" data-to="9d8438262b8d5be38af0b4110132f4dd" /><path d="M 655 1050 L 436 1050" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="9d8438262b8d5be38af0b4110132f4dd" data-to="651e312bbe485bdd813d947a0dd19575" /><rect x="463" y="1000" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="470" y="1018" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">Không</text><path d="M 56 1060 L 32 1060 L 32 848 L 560 848" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="651e312bbe485bdd813d947a0dd19575" data-to="f73f9ee95764545b9cfec919b1a1eadd" /><path d="M 810 1115 L 810 1190" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="9d8438262b8d5be38af0b4110132f4dd" data-to="4489e972f6cd558b8f842c5bced84c4c" /><rect x="827" y="1140" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="1158" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Có</text><path d="M 810 1364 L 810 1420" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="4489e972f6cd558b8f842c5bced84c4c" data-to="1a8300003c5b510d91ffd30c3ee8ef03" /><path d="M 965 1485 L 1160 1485" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="1a8300003c5b510d91ffd30c3ee8ef03" data-to="afeb70b7ada15662ab9fb83c94f3800a" /><rect x="993" y="1432" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1000" y="1450" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">Không</text><path d="M 810 1550 L 810 1630" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="1a8300003c5b510d91ffd30c3ee8ef03" data-to="1545fc4bc61c595e8a6e9bf43b058dfd" /><rect x="827" y="1577" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="1595" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Có</text><path d="M 810 1804 L 810 1845" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="1545fc4bc61c595e8a6e9bf43b058dfd" data-to="8440c185002e5d60895562e3095ae449" /><path d="M 965 1910 L 1160 1910" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="8440c185002e5d60895562e3095ae449" data-to="88d5ee30cbb15d13aafc409ad3e8c38f" /><rect x="993" y="1859" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1000" y="1877" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">Không</text><path d="M 1540 1910 L 1570 1910 L 1570 1278 L 1060 1278" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="88d5ee30cbb15d13aafc409ad3e8c38f" data-to="4489e972f6cd558b8f842c5bced84c4c" /><rect x="1133" y="1222" width="140.0" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1140" y="1240" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="126.0">Đánh giá lại</text><path d="M 810 1975 L 810 2050" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="8440c185002e5d60895562e3095ae449" data-to="91c985219c6450cfb4c1bf5be83612a9" /><rect x="827" y="1992" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="2010" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Có</text><path d="M 56 2216 L 1544 2216" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="2248" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Nguồn: BR-16–19 · UC-OPS01/02/07/08/09 · Admin cấp user/role; approval không là quyền Admin chung</text><text x="56" y="2278" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Thiết kế mục tiêu • Chưa triển khai • Giá trị vận hành/nhánh chưa chốt được ghi tại D-40</text></g></svg>