<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1920" viewBox="0 0 1600 1920" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW06" data-source-sheet="ffef215d67eb4a38a64dbe4a74" data-topic="d4592535fc254d65b514807538"><title id="title">Asset flow</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW06", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "ffef215d67eb4a38a64dbe4a74", "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1920" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW06</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Supporting flow — asset issue and return</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">M/A asset mutations • AI may coordinate specialist tasks, not issue or purchase devices.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="asset" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="65417dcb22335a20b1febd00ef7af8d6"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="296.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Open authorized asset record</text><text x="580" y="327.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Read current state/assignment/history; never edit holder in</text><text x="580" y="350.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">metadata.</text></g><g class="diagram-decision" data-node="stock" data-topic="14ed37fd38705a95a3f4d5a0bf6cdc5e"><polygon points="810,445.0 965.0,510 810,575.0 655.0,510" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,445.0 965.0,510 810,575.0 655.0,510" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="504.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">In Stock and</text><text x="810" y="528.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">unassigned?</text></g><g class="diagram-node" data-node="stop" data-x="1160" data-y="430" data-width="380" data-height="194" data-topic="e5542d34d62d5783991ffa40f0ea2f8c"><rect x="1158" y="428" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="430" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="430" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="456.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">CONTROLS</text><text x="1180" y="486.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">New issue prohibited</text><text x="1180" y="517.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">In Use/Under Repair/Retired or insufficient</text><text x="1180" y="540.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">stock: exception, no fabricated availability.</text></g><g class="diagram-node" data-node="receiver" data-x="560" data-y="670" data-width="500" data-height="150" data-topic="05a1dfd984b45e268fa7313cf018dc6f"><rect x="558" y="668" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="670" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="670" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="696.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="726.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Select active recipient</text><text x="580" y="757.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Record department-at-issue, date, issuer, and notes.</text></g><g class="diagram-node" data-node="assign" data-x="560" data-y="900" data-width="500" data-height="174" data-topic="76fb37708b9955408415ffd727331f65"><rect x="558" y="898" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="900" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="900" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="926.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">ASSET SERVICE</text><text x="580" y="956.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Issue asset trong transaction</text><text x="580" y="987.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Check version and unique assignment. One concurrent issue</text><text x="580" y="1010.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">succeeds; audit the result.</text></g><g class="diagram-node" data-node="using" data-x="560" data-y="1160" data-width="500" data-height="150" data-topic="845576487f1851aa9134ed547e7e950b"><rect x="558" y="1158" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1160" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1160" width="5" height="150" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1186.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">ASSET STATE</text><text x="580" y="1216.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">In Use</text><text x="580" y="1247.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Exactly one active assignment. Track warranty/history/related</text><text x="580" y="1270.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">tickets within scope.</text></g><g class="diagram-node" data-node="return" data-x="560" data-y="1420" data-width="500" data-height="174" data-topic="bbb0eb815d745cdcbf94353f2314a3a4"><rect x="558" y="1418" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1420" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1420" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1446.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="1476.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Return asset when requested</text><text x="580" y="1507.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">End assignment; select In Stock/Under Repair with reason.</text><text x="580" y="1530.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Preserve history.</text></g><g class="diagram-node" data-node="history" data-x="560" data-y="1680" data-width="500" data-height="130" data-topic="b338a655183052598e563b7c3bdb5fdb"><rect x="558" y="1678" width="504" height="134" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1680" width="500" height="130" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1680" width="5" height="130" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1706.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="1736.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Check result / history</text><text x="580" y="1767.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Re-read state/history from committed records.</text></g><g class="diagram-node" data-node="repair" data-x="1160" data-y="1120" data-width="380" data-height="194" data-topic="1be938745d925361b8798d1eb85378b9"><rect x="1158" y="1118" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="1120" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="1120" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="1146.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">M/A</text><text x="1180" y="1176.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Controlled repairs</text><text x="1180" y="1207.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">May retain holder responsibility; no new</text><text x="1180" y="1230.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">issue. Repair completion follows BR-11</text><text x="1180" y="1253.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">guards.</text></g><path d="M 810 390 L 810 445" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="65417dcb22335a20b1febd00ef7af8d6" data-to="14ed37fd38705a95a3f4d5a0bf6cdc5e" /><path d="M 965 510 L 1160 510" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="14ed37fd38705a95a3f4d5a0bf6cdc5e" data-to="e5542d34d62d5783991ffa40f0ea2f8c" /><rect x="993" y="460" width="66.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1000" y="478.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="52.5">No</text><path d="M 810 575 L 810 670" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="14ed37fd38705a95a3f4d5a0bf6cdc5e" data-to="05a1dfd984b45e268fa7313cf018dc6f" /><rect x="827" y="602" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="620.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Yes</text><path d="M 810 820 L 810 900" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="05a1dfd984b45e268fa7313cf018dc6f" data-to="76fb37708b9955408415ffd727331f65" /><path d="M 810 1074 L 810 1160" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="76fb37708b9955408415ffd727331f65" data-to="845576487f1851aa9134ed547e7e950b" /><path d="M 810 1310 L 810 1420" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="845576487f1851aa9134ed547e7e950b" data-to="bbb0eb815d745cdcbf94353f2314a3a4" /><rect x="827" y="1345" width="129.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="834" y="1363.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="115.5">On revocation</text><path d="M 1060 1235 L 1160 1235" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="845576487f1851aa9134ed547e7e950b" data-to="1be938745d925361b8798d1eb85378b9" /><rect x="1093" y="1062" width="140.0" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1100" y="1080.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="126.0">If under repair</text><path d="M 1350 1314 L 1350 1507 L 1060 1507" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="1be938745d925361b8798d1eb85378b9" data-to="bbb0eb815d745cdcbf94353f2314a3a4" /><rect x="1093" y="1452" width="129.5" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="1100" y="1470.0" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="115.5">On revocation</text><path d="M 810 1594 L 810 1680" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="bbb0eb815d745cdcbf94353f2314a3a4" data-to="b338a655183052598e563b7c3bdb5fdb" /><path d="M 56 1826 L 1544 1826" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1858.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: BR-11 · UC27–31 · One active assignment; reservation/TTL remain D-40</text><text x="56" y="1888.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Target design • Not implemented • Open operational values/branches recorded in D-40</text></g></svg>