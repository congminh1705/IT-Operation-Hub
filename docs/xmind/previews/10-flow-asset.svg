<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1920" viewBox="0 0 1600 1920" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW06" data-source-sheet="ffef215d67eb4a38a64dbe4a74" data-topic="d4592535fc254d65b514807538"><title id="title">Luồng hỗ trợ — cấp phát và thu hồi tài sản</title><desc id="desc">Chỉ M/A mutation tài sản • AI có thể điều phối task chuyên môn, không tự cấp phát hoặc tự mua thiết bị.. Thiết kế mục tiêu, chưa triển khai.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW06", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "ffef215d67eb4a38a64dbe4a74"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1920" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB  /  FIG-FLOW06</text><text x="56" y="92" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Luồng hỗ trợ — cấp phát và thu hồi tài sản</text><text x="56" y="126" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">Chỉ M/A mutation tài sản • AI có thể điều phối task chuyên môn, không tự cấp phát hoặc tự mua thiết bị.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="asset" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="65417dcb22335a20b1febd00ef7af8d6"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="266" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="296" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Mở hồ sơ tài sản đúng quyền</text><text x="580" y="327" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Đọc trạng thái, assignment và lịch sử hiện tại;</text><text x="580" y="350" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">không sửa người giữ trong metadata.</text></g><g class="diagram-decision" data-node="stock" data-topic="14ed37fd38705a95a3f4d5a0bf6cdc5e"><polygon points="810,445.0 965.0,510 810,575.0 655.0,510" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,445.0 965.0,510 810,575.0 655.0,510" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="504" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">Trong kho và chưa</text><text x="810" y="528" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="217.0">cấp?</text></g><g class="diagram-node" data-node="stop" data-x="1160" data-y="430" data-width="380" data-height="194" data-topic="e5542d34d62d5783991ffa40f0ea2f8c"><rect x="1158" y="428" width="384" height="198" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="1160" y="430" width="380" height="194" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="1160" y="430" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="1180" y="456" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">KIỂM SOÁT</text><text x="1180" y="486" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Không được cấp mới</text><text x="1180" y="517" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Đang dùng/sửa/ngừng dùng hoặc thiếu</text><text x="1180" y="540" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">inventory: báo ngoại lệ; không giả</text><text x="1180" y="563" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">có thiết bị.</text></g><g class="diagram-node" data-node="receiver" data-x="560" data-y="670" data-width="500" data-height="150" data-topic="05a1dfd984b45e268fa7313cf018dc6f"><rect x="558" y="668" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="670" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="670" width="5" height="150" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="696" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="726" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Chọn người nhận hoạt động</text><text x="580" y="757" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Ghi phòng ban tại thời điểm giao, ngày giao,</text><text x="580" y="780" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">người giao và ghi chú.</text></g><g class="diagram-node" data-node="assign" data-x="560" data-y="900" data-width="500" data-height="174" data-topic="76fb37708b9955408415ffd727331f65"><rect x="558" y="898" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="900" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="900" width="5" height="174" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="926" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">ASSET SERVICE</text><text x="580" y="956" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Cấp phát trong transaction</text><text x="580" y="987" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Kiểm version và unique assignment. Chỉ một lượt</text><text x="580" y="1010" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">cấp đồng thời thành công; lưu audit.</text></g><g class="diagram-node" data-node="using" data-x="560" data-y="1160" data-width="500" data-height="150" data-topic="845576487f1851aa9134ed547e7e950b"><rect x="558" y="1158" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1160" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1160" width="5" height="150" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="1186" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">ASSET STATE</text><text x="580" y="1216" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Đang sử dụng</text><text x="580" y="1247" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Đúng một assignment hiệu lực. Theo dõi bảo hành,</text><text x="580" y="1270" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">lịch sử và ticket liên quan đúng scope.</text></g><g class="diagram-node" data-node="return" data-x="560" data-y="1420" data-width="500" data-height="174" data-topic="bbb0eb815d745cdcbf94353f2314a3a4"><rect x="558" y="1418" width="504" height="178" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1420" width="500" height="174" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1420" width="5" height="174" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1446" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="1476" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Thu hồi khi có yêu cầu</text><text x="580" y="1507" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Kết thúc assignment; chọn Trong kho/Đang sửa</text><text x="580" y="1530" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">chữa, có lý do. Không xóa lịch sử.</text></g><g class="diagram-node" data-node="history" data-x="560" data-y="1680" data-width="500" data-height="130" data-topic="b338a655183052598e563b7c3bdb5fdb"><rect x="558" y="1678" width="504" height="134" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="1680" width="500" height="130" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="1680" width="5" height="130" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="580" y="1706" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">M/A</text><text x="580" y="1736" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Kiểm tra kết quả / lịch sử</text><text x="580" y="1767" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Đọc lại trạng thái và lịch sử từ dữ liệu đã</text><text x="580" y="1790" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">commit.</text></g><