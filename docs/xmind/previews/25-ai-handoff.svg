<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="930" viewBox="0 0 2200 930" role="img" aria-labelledby="title desc"><title id="title">Handoff AI về nghiệp vụ</title><desc id="desc">Sơ đồ từ nội dung XMind. Trợ lý AI thuộc MVP; giữ nguyên nghiệp vụ lõi.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}</style>
