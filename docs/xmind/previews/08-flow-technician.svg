" stroke="none" stroke-width="0" /><text x="390" y="1434" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="178.5">Có kết quả hợp lệ</text><path d="M 1244 810 L 1244 930" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="cec4a9d4c67e58b895aa45c235fef5fe" data-to="74815446d51b55128be1252efe71c2d7" /><path d="M 1244 1090 L 1244 1210" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="74815446d51b55128be1252efe71c2d7" data-to="73a7eead400651b9ae711db60b8dc33c" /><path d="M 1244 1370 L 1244 1475" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="73a7eead400651b9ae711db60b8dc33c" data-to="70ecf709220c5fbbac0175e666357547" /><path d="M 1094 1540 L 850 1540 L 850 1860 L 676 1860" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="70ecf709220c5fbbac0175e666357547" data-to="ea8752e2bddd5333b0466f9cee8ac483" /><rect x="869" y="1582" width="64" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="876" y="1600" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="50">Có</text><path d="M 676 1830 L 820 1830 L 820 1170 L 1244 1170 L 1244 1210" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="ea8752e2bddd5333b0466f9cee8ac483" data-to="73a7eead400651b9ae711db60b8dc33c" /><rect x="833" y="1122" width="119.0" height="32" rx="4" fill="white" stroke="none" stroke-width="0" /><text x="840" y="1140" fill="#1858B4" font-size="16" font-weight="400" text-anchor="start" data-max-width="105.0">Đã bổ sung</text><path d="M 1244 1605 L 1244 1950" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-l