<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2300" viewBox="0 0 1600 2300" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW04" data-source-sheet="6a2db4097dcb4b0ebe9c63324f" data-topic="a0116d276d83451fa644248ae8"><title id="title">Technician flow</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW04", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/permissions-matrix.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "source_sheet": "6a2db4097dcb4b0ebe9c63324f", "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="2300" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW04</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Primary flow — Technician execution</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">Assigned Tasks differ from intake Tickets • T self-claims unassigned team tickets, never assigns others.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="queue" data-x="560" data-y="240" data-width="500" data-height="150" data-topic="ed7defbff79255e48f3fb5629939b8f2"><rect x="558" y="238" width="504" height="154" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="560" y="240" width="500" height="150" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="560" y="240" width="5" height="150" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="580" y="266.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">TECHNICIAN</text><text x="580" y="296.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Open work queue</text><text x="580" y="327.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Own/team tasks and scoped tickets; active</text><text x="580" y="350.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">account/membership.</text></g><g class="diagram-decision" data-node="kind" data-topic="02b539ea1f6c5fce9a3aae6e58aa9106"><polygon points="810,445.0 970.0,510 810,575.0 650.0,510" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="810,445.0 970.0,510 810,575.0 650.0,510" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="810" y="516.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="224.0">Select work item</text></g><g class="diagram-node" data-node="ready" data-x="56" data-y="650" data-width="620" data-height="160" data-topic="44d7b8d33b9c5edd93bb74746d5b0a9a"><rect x="54" y="648" width="624" height="164" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="650" width="620" height="160" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="650" width="5" height="160" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="76" y="676.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="580">TASK BRANCH</text><text x="76" y="706.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="580">Check Ready task</text><text x="76" y="737.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">Assigned; predecessors Done; sufficient data/schedule/remaining. Missing</text><text x="76" y="760.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">conditions block start.</text></g><g class="diagram-node" data-node="starttask" data-x="56" data-y="930" data-width="620" data-height="160" data-topic="7961e017c3305a3782f13515be857f4c"><rect x="54" y="928" width="624" height="164" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="930" width="620" height="160" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="930" width="5" height="160" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="76" y="956.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="580">TASK BRANCH</text><text x="76" y="986.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="580">Ready → In Progress</text><text x="76" y="1017.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">Authorized assignee/M/A rechecks dependencies/version before writes.</text></g><g class="diagram-node" data-node="progress" data-x="56" data-y="1210" data-width="620" data-height="160" data-topic="08ec8306d120598ba50ec8bd696ec77e"><rect x="54" y="1208" width="624" height="164" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1210" width="620" height="160" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1210" width="5" height="160" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="76" y="1236.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="580">TASK BRANCH</text><text x="76" y="1266.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="580">Update progress / Blocked</text><text x="76" y="1297.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">Versioned remaining/reason. Unblock through checked Ready, never jump</text><text x="76" y="1320.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">directly to Done.</text></g><g class="diagram-node" data-node="done" data-x="56" data-y="1490" data-width="620" data-height="170" data-topic="eecf3e8d93a15edfb36f4085a2b87c25"><rect x="54" y="1488" width="624" height="174" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1490" width="620" height="170" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1490" width="5" height="170" rx="2" fill="#087F80" stroke="none" stroke-width="0" /><text x="76" y="1516.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="580">TASK BRANCH</text><text x="76" y="1546.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="580">Record Done</text><text x="76" y="1577.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">Authorized human records result, remaining=0. Done does not resolve/close</text><text x="76" y="1600.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">tickets.</text></g><g class="diagram-node" data-node="claim" data-x="944" data-y="650" data-width="600" data-height="160" data-topic="cec4a9d4c67e58b895aa45c235fef5fe"><rect x="942" y="648" width="604" height="164" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="944" y="650" width="600" height="160" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="944" y="650" width="5" height="160" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="964" y="676.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="560">TICKET BRANCH</text><text x="964" y="706.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="560">Self-claim if unassigned</text><text x="964" y="737.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">Team ticket, active user, current version. Prior claim causes conflict, never</text><text x="964" y="760.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">overwrite.</text></g><g class="diagram-node" data-node="startticket" data-x="944" data-y="930" data-width="600" data-height="160" data-topic="74815446d51b55128be1252efe71c2d7"><rect x="942" y="928" width="604" height="164" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="944" y="930" width="600" height="160" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="944" y="930" width="5" height="160" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="964" y="956.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="560">TICKET BRANCH</text><text x="964" y="986.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="560">New → Open → In Progress</text><text x="964" y="1017.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">Acceptance is not first response. Start requires valid assignee; no direct</text><text x="964" y="1040.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">New→In Progress.</text></g><g class="diagram-node" data-node="audience" data-x="944" data-y="1210" data-width="600" data-height="160" data-topic="73a7eead400651b9ae711db60b8dc33c"><rect x="942" y="1208" width="604" height="164" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="944" y="1210" width="600" height="160" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="944" y="1210" width="5" height="160" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="964" y="1236.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="560">TICKET BRANCH</text><text x="964" y="1266.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="560">Use the correct audience</text><text x="964" y="1297.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">Only eligible public IT comments satisfy first response. Internal notes do</text><text x="964" y="1320.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">not.</text></g><g class="diagram-decision" data-node="missing" data-topic="70ecf709220c5fbbac0175e666357547"><polygon points="1244,1475.0 1394.0,1540 1244,1605.0 1094.0,1540" fill="white" stroke="#5CC8FF" stroke-width="8" /><polygon points="1244,1475.0 1394.0,1540 1244,1605.0 1094.0,1540" fill="#EEF7FF" stroke="#1858B4" stroke-width="2.8" /><text x="1244" y="1534.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="210.0">Need more</text><text x="1244" y="1558.0" fill="#1858B4" font-size="19" font-weight="700" text-anchor="middle" data-max-width="210.0">information?</text></g><g class="diagram-node" data-node="pending" data-x="56" data-y="1780" data-width="620" data-height="170" data-topic="ea8752e2bddd5333b0466f9cee8ac483"><rect x="54" y="1778" width="624" height="174" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="56" y="1780" width="620" height="170" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="56" y="1780" width="5" height="170" rx="2" fill="#A86B12" stroke="none" stroke-width="0" /><text x="76" y="1806.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="580">IT ASKS / REQUESTER CLARIFIES</text><text x="76" y="1836.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="580">Public question → Pending</text><text x="76" y="1867.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">Substantive public requester reply resumes In Progress; AI chat does not</text><text x="76" y="1890.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="580">replace IT questions.</text></g><g class="diagram-node" data-node="resolved" data-x="944" data-y="1950" data-width="600" data-height="160" data-topic="30945d2e866853f4ac46e9baede17ac4"><rect x="942" y="1948" width="604" height="164" rx="14" fill="none" stroke="#5CC8FF" stroke-width="6" opacity=".72" /><rect x="944" y="1950" width="600" height="160" rx="12" fill="#F5F8FD" stroke="#1858B4" stroke-width="2.7" /><rect x="944" y="1950" width="5" height="160" rx="2" fill="#2457C5" stroke="none" stroke-width="0" /><text x="964" y="1976.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="560">AUTHORIZED IT</text><text x="964" y="2006.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="560">Public solution → Resolved</text><text x="964" y="2037.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">Await original requester acceptance under FIG-FLOW03. No automatic</text><text x="964" y="2060.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="560">Closed or SLA reset.</text></g><path d="M 810 390 L 810 445" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="ed7defbff79255e48f3fb5629939b8f2" data-to="02b539ea1f6c5fce9a3aae6e58aa9106" /><path d="M 650 510 L 366 510 L 366 650" fill="none" stroke="#2457C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-f