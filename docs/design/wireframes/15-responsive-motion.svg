center" data-center-x="1230.0" data-center-y="666.0" transform="translate(1171.995849609375 656)"><text x="0" y="16" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" data-max-width="216">Duyệt phương án</text></g></g><rect x="56" y="800" width="1328" height="184" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="80" y="834" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="1280">Chuyển động có mục đích</text><text x="80" y="867" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="1280">Mở panel 180 ms, dịch tối đa 8 px; không tự bật. Reduced motion: cập nhật trực tiếp, không trượt/shimmer. Không làm chậm lỗi, không hiệu</text><text x="80" y="895" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="1280">ứng “đã giao” trước commit. Zoom 200% phải reflow khi triển khai.</text><path d="M56 1046 L1408 1046" stroke="#D7E4F1" stroke-width="1" fill="none"></path><text x="56" y="1078" font-size="12.5" fill="#566579" font-weight="400" text-anchor="start" data-max-width="1352">Bản thiết kế v0.8 · Dữ liệu DEMO tổng hợp · Chưa có ứng dụng thực thi</text></g></svg>