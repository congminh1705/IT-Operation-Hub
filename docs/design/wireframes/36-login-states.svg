<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">Đăng nhập · Trạng thái và tương tác</title><desc id="desc">UI/UX v0.8, thiết kế mục tiêu cho SCR01. Nội dung DEMO hư cấu; không có tương tác hay nghiệp vụ đã thực thi.</desc><metadata id="documentation-contract">{"figure_id": "UI-36", "notation": "ui-wireframe", "status": "design-draft", "authority": "derived", "implementation": "not-started", "version": "0.8", "screen_ids": ["SCR01"], "role": "R", "data": "synthetic DEMO only", "sources": ["docs/07-uiux-specification.md", "docs/design/design-system.md", "docs/requirements/permissions-matrix.md"], "skill": "apple-design", "documentation_standard": "docs/documentation-standard.md"}</metadata><defs><filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#182538" flood-opacity=".05"></feDropShadow></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#EDF5FC" stroke="none" stroke-width="1"></rect><text x="56" y="80" font-size="32" fill="#182538" font-weight="700" text-anchor="start" data-max-width="1488">Đăng nhập dễ hiểu ở từng trạng thái</text><text x="56" y="124" font-size="16" fill="#566579" font-weight="400" text-anchor="start" data-max-width="1488">Bảng thiết kế tương tác · Không có tài khoản hoặc mật khẩu thật · Chưa triển khai</text><rect x="56" y="180" width="480" height="412" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="80" y="219" font-size="20" fill="#182538" font-weight="700" text-anchor="start" data-max-width="432">Focus &amp; bàn phím</text><text x="80" y="284" font-size="15" fill="#182538" font-weight="600" text-anchor="start" data-max-width="432">Email công ty</text><rect x="80" y="300" width="432" height="52" rx="12" fill="#FFFFFF" stroke="#718096" stroke-width="1"></rect><rect x="76" y="296" width="440" height="60" rx="16" fill="none" stroke="#2155CD" stroke-width="2"></rect><text x="96" y="333" font-size="16" fill="#566579" font-weight="400" text-anchor="start" data-max-width="400">Nhập email công ty</text><text x="80" y="422" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">Tab theo thứ tự; Enter gửi form khi hợp lệ. Nút</text><text x="80" y="448" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">hiện mật khẩu không gửi form.</text><text x="80" y="545" font-size="14" fill="#2155CD" font-weight="600" text-anchor="start" data-max-width="432">Focus 2 px · khoảng cách 2 px</text><rect x="560" y="180" width="480" height="412" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="584" y="219" font-size="20" fill="#182538" font-weight="700" text-anchor="start" data-max-width="432">Dữ liệu cần chỉnh</text><text x="584" y="284" font-size="15" fill="#182538" font-weight="600" text-anchor="start" data-max-width="432">Email công ty</text><rect x="584" y="300" width="432" height="52" rx="12" fill="#FFFFFF" stroke="#B42335" stroke-width="1"></rect><text x="600" y="333" font-size="16" fill="#566579" font-weight="400" text-anchor="start" data-max-width="400">email-chua-hop-le</text><g transform="translate(584 366) scale(0.75)" color="#B42335"><path d="M 12.0 2.0 L 23.0 21.0 L 1.0 21.0 Z" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"></path>
<line x1="12.0" y1="8.0" x2="12.0" y2="13.0" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"></line>
<circle cx="12.0" cy="17.0" r="0.7" fill="#334155" stroke="currentColor" stroke-width="1.85"></circle>
</g><text x="612" y="381" font-size="14" fill="#B42335" font-weight="500" text-anchor="start" data-max-width="404">Nhập email hợp lệ.</text><text x="584" y="455" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">Báo lỗi cạnh trường sau tương tác; đưa focus về</text><text x="584" y="481" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">lỗi đầu khi gửi.</text><rect x="1064" y="180" width="480" height="412" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="1088" y="219" font-size="20" fill="#182538" font-weight="700" text-anchor="start" data-max-width="432">Hiện/ẩn &amp; Caps Lock</text><text x="1088" y="284" font-size="15" fill="#182538" font-weight="600" text-anchor="start" data-max-width="432">Mật khẩu</text><rect x="1088" y="300" width="432" height="52" rx="12" fill="#FFFFFF" stroke="#718096" stroke-width="1"></rect><text x="1104" y="333" font-size="16" fill="#566579" font-weight="400" text-anchor="start" data-max-width="348">••••••••</text><g data-control="icon-button" data-label="Hiện mật khẩu" data-x="1472" data-y="304" data-width="44" data-height="44"><g transform="translate(1484 316) scale(0.8333333333333334)" color="#566579"><path d="M 2.0 12.0 C 7.0 3.0 17.0 3.0 22.0 12.0 C 17.0 21.0 7.0 21.0 2.0 12.0 Z" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12.0" cy="12.0" r="3.0" fill="none" stroke="currentColor" stroke-width="1.85"></circle>
</g></g><rect x="1088" y="388" width="300" height="28" rx="8" fill="#FFF6E5" stroke="none" stroke-width="1"></rect><text x="1099" y="407" font-size="13.5" fill="#875500" font-weight="600" text-anchor="start" data-max-width="278">Caps Lock đang bật</text><text x="1088" y="457" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">Chỉ hiện cảnh báo khi Caps Lock bật. Hiện/ẩn giữ</text><text x="1088" y="483" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">nội dung và con trỏ.</text><text x="1088" y="556" font-size="13" fill="#566579" font-weight="400" text-anchor="start" data-max-width="432">Minh họa dữ liệu user vừa nhập, không điền sẵn.</text><rect x="56" y="630" width="480" height="412" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="80" y="669" font-size="20" fill="#182538" font-weight="700" text-anchor="start" data-max-width="432">Đang đăng nhập</text><g data-control="button" data-label="Đang đăng nhập…" data-x="80" data-y="742" data-width="432" data-height="52" data-alignment="center"><rect x="80" y="742" width="432" height="52" rx="12" fill="#2155CD" stroke="none" stroke-width="1"></rect><g data-button-content="center" data-center-x="296.0" data-center-y="768.0" transform="translate(214.00260663032532 758.5)"><g transform="translate(0 0) scale(0.8333333333333334)" color="#FFFFFF"><path d="M 21.0 9.0 C 18.0 0.0 5.0 0.0 2.0 9.0 M 2.0 4.0 L 2.0 9.0 L 7.0 9.0 M 3.0 15.0 C 6.0 24.0 19.0 24.0 22.0 15.0 M 22.0 20.0 L 22.0 15.0 L 17.0 15.0" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"></path>
</g><text x="28" y="16" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" data-max-width="372">Đang đăng nhập…</text></g></g><text x="80" y="865" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">Giữ bố cục ổn định, báo đang xử lý. Chặn gửi</text><text x="80" y="892" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="432">lặp trong khi chờ.</text><text x="80" y="995" font-size="14" fill="#566579" font-weight="400" text-anchor="start" data-max-width="432">Reduced motion: chỉ chữ và icon tĩnh.</text><rect x="560" y="630" width="480" height="412" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="584" y="669" font-size="20" fill="#182538" font-weight="700" text-anchor="start" data-max-width="432">Thông tin chưa đúng</text><rect x="584" y="728" width="432" height="96" rx="14" fill="#FFF0F1" stroke="none" stroke-width="1"></rect><g transform="translate(600 746) scale(0.9166666666666666)" color="#B42335"><path d="M 12.0 2.0 L 23.0 21.0 L 1.0 21.0 Z" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"></path>
<line x1="12.0" y1="8.0" x2="12.0" y2="13.0" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"></line>
<circle cx="12.0" cy="17.0" r="0.7" fill="#334155" stroke="currentColor" stroke-width="1.85"></circle>
</g><text x="638" y="757" font-size="17" fill="#B42335" font-weight="600" text-anchor="start" data-max-width="360">Không thể đăng nhập với thông tin này.</text><g data-control="button" data-label="Đăng nhập lại" data-x="584" data-y="860" data-width="432" data-height="52" data-alignment="center"><rect x="584" y="860" width="432" height="52" rx="12" fill="#2155CD" stroke="none" stroke-width="1"></rect><g data-button-content="center" data-center-x="800.0" data-center-y="886.0" transform="translate(750.0234375 876.5)"><text x="0" y="16" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" data-max-width="400">Đăng nhập lại</text></g></g><text x="584" y="956" font-size="15" fill="#566579" font-weight="400" text-anchor="start" data-max-width="432">Giữ email; không tiết lộ tài khoản tồn tại hay bị</text><text x="584" y="980" font-size="15" fill="#566579" font-weight="400" text-anchor="start" data-max-width="432">khóa.</text><rect x="1064" y="630" width="480" height="412" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="1088" y="669" font-size="20" fill="#182538" font-weight="700" text-anchor="start" data-max-width="432">Kết nối gián đoạn</text><rect x="1088" y="728" width="432" height="96" rx="14" fill="#FFF6E5" stroke="none" stroke-width="1"></rect><g transform="translate(1104 746) scale(0.9166666666666666)" color="#875500"><path d="M 2.0 7.0 C 8.0 1.0 16.0 1.0 22.0 7.0 M 5.0 11.0 C 9.0 7.0 15.0 7.0 19.0 11.0 M 8.0 15.0 C 10.0 13.0 14.0 13.0 16.0 15.0" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12.0" cy="20.0" r="1.2" fill="#334155" stroke="currentColor" stroke-width="1.85"></circle>
</g><text x="1142" y="757" font-size="17" fill="#875500" font-weight="600" text-anchor="start" data-max-width="360">Kết nối bị gián đoạn. Kiểm tra mạng và</text><text x="1142" y="783" font-size="17" fill="#875500" font-weight="600" text-anchor="start" data-max-width="360">thử lại.</text><g data-control="button" data-label="Thử đăng nhập lại" data-x="1088" data-y="860" data-width="432" data-height="52" data-alignment="center"><rect x="1088" y="860" width="432" height="52" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="1304.0" data-center-y="886.0" transform="translate(1238.1328125 876.5)"><text x="0" y="16" font-size="16" fill="#182538" font-weight="600" text-anchor="start" data-max-width="400">Thử đăng nhập lại</text></g></g><text x="1088" y="956" font-size="15" fill="#566579" font-weight="400" text-anchor="start" data-max-width="432">Khi kết quả chưa rõ, kiểm tra phiên trước khi gửi</text><text x="1088" y="980" font-size="15" fill="#566579" font-weight="400" text-anchor="start" data-max-width="432">lại.</text><text x="56" y="1107" font-size="16" fill="#182538" font-weight="500" text-anchor="start" data-max-width="1488">Thành công: tới màn được phép; hết phiên: đăng nhập lại với đường quay về nội bộ hợp lệ.</text><path d="M56 1136 L1568 1136" stroke="#D7E4F1" stroke-width="1" fill="none"></path><text x="56" y="1168" font-size="12.5" fill="#566579" font-weight="400" text-anchor="start" data-max-width="1512">Bản thiết kế v0.8 · Dữ liệu DEMO tổng hợp · Chưa có ứng dụng thực thi</text></g></svg>