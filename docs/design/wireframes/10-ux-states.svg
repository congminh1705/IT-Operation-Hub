<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="title desc"><title id="title">Trạng thái UX — rõ lỗi, giữ ngữ cảnh</title><desc id="desc">UI/UX v0.8, thiết kế mục tiêu cho SCR90/SCR91. Nội dung DEMO hư cấu; không có tương tác hay nghiệp vụ đã thực thi.</desc><metadata id="documentation-contract">{"figure_id": "UI-10", "notation": "ui-wireframe", "status": "design-draft", "authority": "derived", "implementation": "not-started", "version": "0.8", "screen_ids": ["SCR90", "SCR91"], "role": "R", "data": "synthetic DEMO only", "sources": ["docs/07-uiux-specification.md", "docs/design/design-system.md", "docs/requirements/permissions-matrix.md"], "skill": "apple-design", "documentation_standard": "docs/documentation-standard.md"}</metadata><defs><filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#182538" flood-opacity=".05"></feDropShadow></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1090" rx="0" fill="#EDF5FC" stroke="none" stroke-width="1"></rect><text x="56" y="82" font-size="30" fill="#182538" font-weight="700" text-anchor="start" data-max-width="1328">Khi tác vụ chưa thể hoàn tất</text><text x="56" y="124" font-size="16" fill="#566579" font-weight="400" text-anchor="start" data-max-width="1320">Thông báo ngay tại nơi làm việc · không mất bản nhập · không báo thành công trước commit</text><rect x="56" y="190" width="424" height="350" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="80" y="224" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Dữ liệu chưa hợp lệ</text><text x="80" y="288" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Tiêu đề cần ít nhất 5 ký tự. Nội dung</text><text x="80" y="315" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">khác bạn đã nhập được giữ lại.</text><g data-control="button" data-label="Sửa tiêu đề" data-x="80" data-y="442" data-width="376" data-height="44" data-alignment="center"><rect x="80" y="442" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="268.0" data-center-y="464.0" transform="translate(230.751953125 454)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Sửa tiêu đề</text></g></g><rect x="504" y="190" width="424" height="350" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="528" y="224" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Dữ liệu vừa thay đổi</text><text x="528" y="288" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Người phụ trách đã được cập nhật. Tải</text><text x="528" y="315" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">bản mới để đối chiếu trước khi gửi lại.</text><g data-control="button" data-label="Xem dữ liệu mới" data-x="528" data-y="442" data-width="376" data-height="44" data-alignment="center"><rect x="528" y="442" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="716.0" data-center-y="464.0" transform="translate(662.1392822265625 454)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Xem dữ liệu mới</text></g></g><rect x="952" y="190" width="424" height="350" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="976" y="224" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Không có kết quả lọc</text><text x="976" y="288" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Không có kết quả. Thử xóa bộ lọc.</text><g data-control="button" data-label="Xóa bộ lọc" data-x="976" data-y="442" data-width="376" data-height="44" data-alignment="center"><rect x="976" y="442" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="1164.0" data-center-y="464.0" transform="translate(1129.5750732421875 454)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Xóa bộ lọc</text></g></g><rect x="56" y="572" width="424" height="350" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="80" y="606" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Chưa rõ kết quả gửi</text><text x="80" y="670" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Mất kết nối. Kiểm tra kết quả trước khi</text><text x="80" y="697" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">thử lại.</text><g data-control="button" data-label="Kiểm tra kết quả" data-x="80" data-y="824" data-width="376" data-height="44" data-alignment="center"><rect x="80" y="824" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="268.0" data-center-y="846.0" transform="translate(213.46240234375 836)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Kiểm tra kết quả</text></g></g><rect x="504" y="572" width="424" height="350" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="528" y="606" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Không tìm thấy nội dung</text><text x="528" y="670" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Nội dung không tồn tại hoặc bạn không</text><text x="528" y="697" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">còn quyền xem.</text><g data-control="button" data-label="Về yêu cầu của tôi" data-x="528" data-y="824" data-width="376" data-height="44" data-alignment="center"><rect x="528" y="824" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="716.0" data-center-y="846.0" transform="translate(656.556640625 836)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Về yêu cầu của tôi</text></g></g><rect x="952" y="572" width="424" height="350" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="976" y="606" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Đang tải dữ liệu</text><text x="976" y="670" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Bạn vẫn có thể đọc các vùng đã tải.</text><text x="976" y="697" font-size="17" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Không hiển thị số liệu giả.</text><g data-control="button" data-label="Đang tải…" data-x="976" data-y="824" data-width="376" data-height="44" data-alignment="center"><rect x="976" y="824" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="1164.0" data-center-y="846.0" transform="translate(1130.625732421875 836)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Đang tải…</text></g></g><path d="M56 1026 L1408 1026" stroke="#D7E4F1" stroke-width="1" fill="none"></path><text x="56" y="1058" font-size="12.5" fill="#566579" font-weight="400" text-anchor="start" data-max-width="1352">Bản thiết kế v0.8 · Dữ liệu DEMO tổng hợp · Chưa có ứng dụng thực thi</text></g></svg>