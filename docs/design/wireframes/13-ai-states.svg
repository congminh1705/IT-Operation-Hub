<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img" aria-labelledby="title desc"><title id="title">Trạng thái AI — minh bạch và có lối tiếp tục</title><desc id="desc">UI/UX v0.8, thiết kế mục tiêu cho SCR-AI01/SCR-AI02. Nội dung DEMO hư cấu; không có tương tác hay nghiệp vụ đã thực thi.</desc><metadata id="documentation-contract">{"figure_id": "UI-13", "notation": "ui-wireframe", "status": "design-draft", "authority": "derived", "implementation": "not-started", "version": "0.8", "screen_ids": ["SCR-AI01", "SCR-AI02"], "role": "R", "data": "synthetic DEMO only", "sources": ["docs/07-uiux-specification.md", "docs/design/design-system.md", "docs/requirements/permissions-matrix.md"], "skill": "apple-design", "documentation_standard": "docs/documentation-standard.md"}</metadata><defs><filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#182538" flood-opacity=".05"></feDropShadow></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1070" rx="0" fill="#EDF5FC" stroke="none" stroke-width="1"></rect><text x="56" y="82" font-size="30" fill="#182538" font-weight="700" text-anchor="start" data-max-width="1328">AI hỗ trợ, người dùng vẫn kiểm soát</text><text x="56" y="126" font-size="16" fill="#566579" font-weight="400" text-anchor="start" data-max-width="1320">Không có nguồn không bịa câu trả lời · provider lỗi không chặn ticket/SLA</text><rect x="56" y="188" width="424" height="342" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="80" y="222" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Đang tạo nháp</text><text x="80" y="280" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Có thể dừng tạo nội dung. Dừng không thu</text><text x="80" y="305" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">hồi một ticket đã được xác nhận tạo.</text><g data-control="button" data-label="Dừng tạo nội dung" data-x="80" data-y="446" data-width="376" data-height="44" data-alignment="center"><rect x="80" y="446" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="268.0" data-center-y="468.0" transform="translate(205.181396484375 458)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Dừng tạo nội dung</text></g></g><rect x="504" y="188" width="424" height="342" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="528" y="222" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Chưa có nguồn phù hợp</text><text x="528" y="280" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Chưa đủ căn cứ để trả lời. Gửi thêm mô tả</text><text x="528" y="305" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">hoặc tạo yêu cầu cho IT.</text><g data-control="button" data-label="Mở form yêu cầu" data-x="528" data-y="446" data-width="376" data-height="44" data-alignment="center"><rect x="528" y="446" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="716.0" data-center-y="468.0" transform="translate(659.8125 458)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Mở form yêu cầu</text></g></g><rect x="952" y="188" width="424" height="342" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="976" y="222" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">AI tạm thời không khả dụng</text><text x="976" y="280" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Yêu cầu, phản hồi và SLA vẫn hoạt động độc</text><text x="976" y="305" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">lập với provider.</text><g data-control="button" data-label="Tiếp tục bằng form" data-x="976" data-y="446" data-width="376" data-height="44" data-alignment="center"><rect x="976" y="446" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="1164.0" data-center-y="468.0" transform="translate(1101.3841552734375 458)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Tiếp tục bằng form</text></g></g><rect x="56" y="558" width="424" height="342" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="80" y="592" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Quyền nguồn vừa thay đổi</text><text x="80" y="650" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Nguồn không còn được hiển thị. Không dùng</text><text x="80" y="675" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">nội dung đã lưu để lộ dữ liệu cũ.</text><g data-control="button" data-label="Xem nguồn còn quyền" data-x="80" data-y="816" data-width="376" data-height="44" data-alignment="center"><rect x="80" y="816" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="268.0" data-center-y="838.0" transform="translate(193.765625 828)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Xem nguồn còn quyền</text></g></g><rect x="504" y="558" width="424" height="342" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="528" y="592" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Nháp đã thay đổi</text><text x="528" y="650" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Kiểm tra lại bản xem trước và xác nhận nội</text><text x="528" y="675" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">dung mới. Không gửi ngầm.</text><g data-control="button" data-label="Xem bản nháp mới" data-x="528" data-y="816" data-width="376" data-height="44" data-alignment="center"><rect x="528" y="816" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="716.0" data-center-y="838.0" transform="translate(653.915771484375 828)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Xem bản nháp mới</text></g></g><rect x="952" y="558" width="424" height="342" rx="16" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1" filter="url(#soft)"></rect><text x="976" y="592" font-size="18" fill="#182538" font-weight="650" text-anchor="start" data-max-width="376">Phương án chưa khả thi</text><text x="976" y="650" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">Chưa đủ người hoặc dữ liệu. Trình ngoại lệ,</text><text x="976" y="675" font-size="16" fill="#182538" font-weight="400" text-anchor="start" data-max-width="376">không ép giao hay nới hạn tự động.</text><g data-control="button" data-label="Xem thông tin cần bổ sung" data-x="976" data-y="816" data-width="376" data-height="44" data-alignment="center"><rect x="976" y="816" width="376" height="44" rx="12" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1"></rect><g data-button-content="center" data-center-x="1164.0" data-center-y="838.0" transform="translate(1075.05322265625 828)"><text x="0" y="16" font-size="14.5" fill="#182538" font-weight="600" text-anchor="start" data-max-width="344">Xem thông tin cần bổ sung</text></g></g><path d="M56 1006 L1408 1006" stroke="#D7E4F1" stroke-width="1" fill="none"></path><text x="56" y="1038" font-size="12.5" fill="#566579" font-weight="400" text-anchor="start" data-max-width="1352">Bản thiết kế v0.8 · Dữ liệu DEMO tổng hợp · Chưa có ứng dụng thực thi</text></g></svg>