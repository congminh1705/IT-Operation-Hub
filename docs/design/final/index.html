<!doctype html><html lang="vi" data-type="software" data-motion="on"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="page-type" content="software"><meta name="site-kind" content="software"><meta name="description" content="UI final được PO duyệt: Mac / Teal, đăng nhập giữ nguyên."><title>IT Operation Hub / Mac / Teal final</title><link rel="stylesheet" href="dashboard/prompt-dashboard/public/assets/fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#25332f;font:14px/1.6 Inter,sans-serif}header{padding:28px 32px 22px;display:flex;align-items:center;justify-content:space-between;gap:25px;border-bottom:1px solid #dde5e1;background:#fff}h1{font:700 24px/1.4 Inter;margin:0 0 6px;letter-spacing:-.03em}p{color:#5b6b65;font-size:13px;margin:0}a{color:#087f78;text-underline-offset:4px}.catalog-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;flex-wrap:wrap}.catalog-tools label{font-size:12px;font-weight:600}.catalog-tools select{display:inline-block;margin-left:12px;max-width:100%;padding:11px 12px;border:1px solid #ccd9d3;border-radius:5px;color:#25332f;background:#fff;font:13px Inter;min-height:44px}.links{display:flex;gap:20px;font-size:12px}iframe{display:block;width:100%;height:calc(100dvh - 190px);min-height:650px;border:0;border-top:1px solid #dde5e1;background:#fff}a:focus-visible,select:focus-visible{outline:3px solid #087f78;outline-offset:3px}.count{display:inline-flex;border:1px solid #cfe4d9;border-radius:5px;padding:7px 11px;font:600 11px Inter;color:#366a54;white-space:nowrap}@media(max-width:720px){header{padding:20px 16px;align-items:flex-start;flex-wrap:wrap;gap:12px}h1{font-size:21px}.catalog-tools{padding:12px 16px}.catalog-tools label{width:100%}.catalog-tools select{display:block;width:100%;margin:8px 0 0;font-size:16px}iframe{height:80dvh;min-height:700px}}.skip{position:absolute;left:16px;top:-90px;z-index:30;background:#fff;padding:12px}.skip:focus{top:12px}iframe:focus,iframe:focus-visible{outline:3px solid #087f78;outline-offset:-3px}.links a{min-height:44px;display:inline-flex;align-items:center}.links{align-items:center}.links{flex-wrap:wrap}.links button{min-height:44px;padding:10px 14px;border:1px solid #087f78;border-radius:8px;background:#087f78;color:#fff;font:600 12px Inter;cursor:pointer}.links button:focus-visible{outline:3px solid #087f78;outline-offset:3px}</style><link rel="stylesheet" href="assets/motion/motion.css"><script type="module" src="assets/motion/motion.js"></script></head><body><a class="skip" href="#catalog-main">Đến màn review</a><header><div><h1>IT Operation Hub — Mac / Teal final</h1><p>Không gian làm việc rõ ràng, dành cho vận hành IT hằng ngày.</p></div><span class="count">51 màn đã chốt · Đăng nhập giữ nguyên</span></header><main id="catalog-main"><div class="catalog-tools"><label for="screen">Chọn màn để review<select id="screen"></select></label><div class="links"><a id="open" target="_blank" rel="noreferrer">Mở màn riêng ↗</a><a href="01-account.html#login">Đăng nhập đã chốt ↗</a><button class="btn" id="enter-view" type="button">Vào màn review</button></div></div><iframe id="view" tabindex="-1" title="Màn UI đang review"></iframe></main><script>
document.querySelector('#enter-view').addEventListener('click',()=>{const f=document.querySelector('#view');const target=f.contentDocument?.querySelector('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled])');if(target)target.focus();else f.contentWindow.focus()});fetch('screen-gallery.json').then(r=>r.json()).then(items=>{const groups={'01-account':'Tài khoản','02-tickets':'Yêu cầu hỗ trợ','03-work':'Công việc','04-workforce':'Nhân sự và lịch','05-ai':'AI Workspace','06-knowledge-assets':'Tri thức và tài sản','07-monitoring':'Theo dõi và báo cáo','08-admin-states':'Quản trị và trạng thái',dashboard:'Dashboard theo vai trò'};const s=document.querySelector('#screen');for(const [id,label]of Object.entries(groups)){const g=document.createElement('optgroup');g.label=label;items.filter(x=>x.group===id).forEach(x=>{const o=new Option(x.title,x.url);g.append(o)});s.append(g)}const initial=new URLSearchParams(location.search).get('screen');s.value=items.some(x=>x.url===initial)?initial:'dashboard.html?role=manager';function show(){document.querySelector('#view').src=s.value;document.querySelector('#open').href=s.value;history.replaceState(null,'','?screen='+encodeURIComponent(s.value))}s.addEventListener('change',show);show()});</script></body></html>
