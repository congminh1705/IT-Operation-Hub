" y="450" fill="#2457C5" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-AI04</text><text x="1231" y="476" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Tóm tắt theo visibility</text><text x="1231" y="504" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Visibility hiện tại của người đọc</text></g><path d="M 222 448.0 L 386 448.0 L 386 608 L 411 608" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Người dùng · đúng scope:UC-AI07"/><g data-uc="UC-AI07" class="use-case"><ellipse cx="661" cy="608" rx="250" ry="53" fill="#F2F6FC" stroke="#2457C5" stroke-width="1.5"/><text x="661" y="582" fill="#2457C5" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-AI07</text><text x="661" y="608" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Hội thoại cá nhân</text><text x="661" y="636" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Chủ phiên; xóa chat không xóa ticket</text></g><text x="346" y="698" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1198" >Hội thoại dùng quyền người yêu cầu; xác nhận tạo ticket có digest/version/TTL và chống trùng.</text><text x="56" y="776" fill="#087F80" font-size="21" font-weight="700" text-anchor="start" data-max-width="1300" >IT có scope · T/M/A</text><text x="1544" y="776" fill="#536B82" font-size="15" font-weight="400" text-anchor="end" data-max-width="200" >01 mục tiêu</text><rect x="346" y="806" width="1198" height="152" rx="8" fill="#FAFCFE" stroke="#D9E3ED" stroke-width="1.5" /><text x="365" y="828" fill="#536B82" font-size="12" font-weight="600" text-anchor="start" data-max-width="600" >IT OPERATIONS HUB</text><circle cx="180" cy="830.0" r="16" fill="white" stroke="#087F80" stroke-width="2"/><path d="M 180 84