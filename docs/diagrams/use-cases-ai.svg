" font-weight="400" text-anchor="start" data-max-width="1488">Source: UC catalog · Permissions matrix · BR-01–22</text><text x="56" y="1725.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Association means participation, not sequence • AI and scheduler are internal</text></g></svg>