="365" y="1118" fill="#536B82" font-size="12" font-weight="600" text-anchor="start" data-max-width="600" >IT OPERATIONS HUB</text><circle cx="180" cy="1120.0" r="16" fill="white" stroke="#7250AB" stroke-width="2"/><path d="M 180 1136.0 L 180 1184.0" fill="none" stroke="#7250AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 152 1156.0 L 208 1156.0" fill="none" stroke="#7250AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 1184.0 L 157 1215.0" fill="none" stroke="#7250AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 1184.0 L 203 1215.0" fill="none" stroke="#7250AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="1244.0" fill="#7250AB" font-size="18" font-weight="600" text-anchor="middle" data-max-width="250" >Trưởng phòng IT / Admin</text><path d="M 222 1160.0 L 386 1160.0 L 386 1188 L 411 1188" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Trưởng phòng IT / Admin:UC-AI06"/><g data-uc="UC-AI06" class="use-case"><ellipse cx="661" cy="1188" rx="250" ry="53" fill="#F2F6FC" stroke="#7250AB" stroke-width="1.5"/><text x="661" y="1162" fill="#7250AB" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-AI06</text><text x="661" y="1188" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Giải thích facts báo cáo</text><text x="661" y="1216" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >MET allowlist; không bịa số liệu</text></g><text x="346" y="1278" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1198" >Giải thích facts đã tính bằng MET và scope, không nhận câu SQL/metric do model tự viết.</text><text x="56" y="1356" fill="#14283F" font-size="21" font-weight="700" text-anchor="start" data-max-width="1300" >Admin</text><text x="1544" y="1356" fill="#536B82" font-size="15" font-weight="400" text-anchor="end" data-max-width="200" >01 mục tiêu</text><rect x="346" y="1386" width="1198" height="152" rx="8" fill="#FAFCFE" stroke="#D9E3ED" stroke-width="1.5" /><text x="365" y="1408" fill="#536B82" font-size="12" font-weight="600" text-anchor="start" data-max-width="600" >IT OPERATIONS HUB</text><circle cx="180" cy="1410.0" r="16" fill="white" stroke="#14283F" stroke-width="2"/><path d="M 180 1426.0 L 180 1474.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 152 1446.0 L 208 1446.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 1474.0 L 157 1505.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 1474.0 L 203 1505.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="1534.0" fill="#14283F" font-size="18" font-weight="600" text-anchor="middle" data-max-width="250" >Admin</text><path d="M 222 1450.0 L 386 1450.0 L 386 1478 L 411 1478" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Admin:UC-AI08"/><g data-uc="UC-AI08" class="use-case"><ellipse cx="661" cy="1478" rx="250" ry="53" fill="#F2F6FC" stroke="#14283F" stroke-width="1.5"/><text x="661" y="1452" fill="#14283F" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-AI08</text><text x="661" y="1478" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Cấu hình khả dụng AI</text><text x="661" y="1506" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Admin; không trả secret/chat người khác</text></g><text x="346" y="1568" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1198" >Bật/tắt theo khả dụng; không cấp