u / hỏi bổ sung</text><text x="661" y="372" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Thiếu dữ liệu: hỏi, không đoán</text></g><path d="M 222 316.0 L 316 316.0 L 316 286 L 956 286 L 956 344 L 981 344" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Requester / người đọc KB:UC-OPS10"/><g data-uc="UC-OPS10" class="use-case"><ellipse cx="1231" cy="344" rx="250" ry="53" fill="#F2F6FC" stroke="#2457C5" stroke-width="1.5"/><text x="1231" y="318" fill="#2457C5" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-OPS10</text><text x="1231" y="344" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Tra cứu / quản lý KB</text><text x="1231" y="372" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Published / version / ACL hiện tại</text></g><text x="346" y="434" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1198" >Bổ sung dữ liệu cho yêu cầu của mình; nguồn Published còn ACL; không đọc plan nhân lực/approval nội bộ.</text><text x="56" y="512" fill="#087F80" font-size="21" font-weight="700" text-anchor="start" data-max-width="1300" >Người thực hiện · T/M/A</text><text x="1544" y="512" fill="#536B82" font-size="15" font-weight="400" text-anchor="end" data-max-width="200" >01 mục tiêu</text><rect x="346" y="542" width="1198" height="152" rx="8" fill="#FAFCFE" stroke="#D9E3ED" stroke-width="1.5" /><text x="365" y="564" fill="#536B82" font-size="12" font-weight="600" text-anchor="start" data-max-width="600" >IT OPERATIONS HUB</text><circle cx="180" cy="566.0" r="16" fill="white" stroke="#087F80" stroke-width="2"/><path d="M 180 582.0 L 180 630.0" fill="none" stroke="#087F80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 152 602.0 L 208 602.0" fill="none" stroke="#087F80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 630.0 L 157 661.0" fill="none" stroke="#087F80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 630.0 L 203 661.0" fill="none" stroke="#087F80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="690.0" fill="#087F80" font-size="18" font-weight="600" text-anchor="middle" data-max-width="250" >Người thực hiện · T/M/A</text><path d="M 222 606.0 L 386 606.0 L 386 634 L 411 634" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Người thực hiện · T/M/A:UC-OPS06"/><g data-uc="UC-OPS06" class="use-case"><ellipse cx="661" cy="634" rx="250" ry="53" fill="#F2F6FC" stroke="#087F80" stroke-width="1.5"/><text x="661" y="608" fill="#087F80" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-OPS06</text><text x="661" y="634" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Cập nhật task và kết quả</text><text x="661" y="662" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Assignee / M/A; Done cần kết quả</text></g><text x="346" y="724" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1198" >Task được giao và đủ dependency; ghi tiến độ/kết quả, không tự đóng ticket khi task Done.</text><text x="56" y="802" fill="#7250AB" font-size="21" font-weight="700" text-anchor="start" data-max-width="1300" >Trưởng phòng IT / Admin</text><text x="1544" y="802" fill="#536B82" font-size="15" font-weight="400" text-anchor="end" data-max-width="200" >07 mục tiêu</text><rect x="346" y="832" width="1198" height="548" rx="8" fill="#FAFCFE" stroke="#D9E3ED" stroke-width="1.5" /><text x="365" y="854" fill="#536B82" font-size="12" font-weight="600" text-anchor="start" data-max-width="600" >IT OPERATIONS HUB</text><circle cx="180" cy="1054.0" r="16" fill="white" stroke="#7250AB"