in:UC-OPS07"/><g data-uc="UC-OPS07" class="use-case"><ellipse cx="661" cy="1188" rx="250" ry="53" fill="#F2F6FC" stroke="#7250AB" stroke-width="1.5"/><text x="661" y="1162" fill="#7250AB" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-OPS07</text><text x="661" y="1188" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Theo dõi / điều phối lại</text><text x="661" y="1216" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Giữ manual lock và việc đang làm</text></g><path d="M 222 1094.0 L 316 1094.0 L 316 866 L 956 866 L 956 1188 L 981 1188" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Trưởng phòng IT / Admin:UC-OPS08"/><g data-uc="UC-OPS08" class="use-case"><ellipse cx="1231" cy="1188" rx="250" ry="53" fill="#F2F6FC" stroke="#7250AB" stroke-width="1.5"/><text x="1231" y="1162" fill="#7250AB" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-OPS08</text><text x="1231" y="1188" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Duyệt ngoại lệ</text><text x="1231" y="1216" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Duyệt ≠ execution thành công</text></g><path d="M 222 1094.0 L 386 1094.0 L 386 1320 L 411 1320" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Trưởng phòng IT / Admin:UC-OPS09"/><g data-uc="UC-OPS09" class="use-case"><ellipse cx="661" cy="1320" rx="250" ry="53" fill="#F2F6FC" stroke="#7250AB" stroke-width="1.5"/><text x="661" y="1294" fill="#7250AB" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-OPS09</text><text x="661" y="1320" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Theo dõi run và audit</text><text x="661" y="1348" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Event → run → intent → kết quả</text></g><text x="346" y="1410" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1198" >AI chạy các bước lập/giao/theo dõi trong policy; M/A quản trị và can thiệp. Model không tự Done/cấp user/chạy shell.</text><text x="56" y="1488" fill="#14283F" font-size="21" font-weight="700" text-anchor="start" data-max-width="1300" >Người được cấp quyền KB</text><text x="1544" y="1488" fill="#536B82" font-size="15" font-weight="400" text-anchor="end" data-max-width="200" >01 mục tiêu</text><rect x="346" y="1518" width="1198" height="152" rx="8" fill="#FAFCFE" stroke="#D9E3ED" stroke-width="1.5" /><text x="365" y="1540" fill="#536B82" font-size="12" font-weight="600" text-anchor="start" data-max-width="600" >IT OPERATIONS HUB</text><circle cx="180" cy="1542.0" r="16" fill="white" stroke="#14283F" stroke-width="2"/><path d="M 180 1558.0 L 180 1606.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 152 1578.0 L 208 1578.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 1606.0 L 157 1637.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 180 1606.0 L 203 1637.0" fill="none" stroke="#14283F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="1666.0" fill="#14283F" font-size="18" font-weight="600" text-anchor="middle" data-max-width="250" >Người được cấp quyền KB</text><path d="M 222 1582.0 L 386 1582.0 L 386 1610 L 411 1610" fill="none" stroke="#AFBED0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-association="Người được cấp quyền KB:UC-OPS10"/><g data-uc="UC-OPS10" class="use-case"><ellipse cx="661" cy="1610" rx="250" ry="53" fill="#F2F6FC" stroke="#14283F" stroke-width="1.5"/><text x="661" y="1584" fill="#14283F" font-size="14" font-weight="700" text-anchor="middle" data-max-width="450" >UC-OPS10</text><text x="661" y="1610" fill="#14283F" font-size="20" font-weight="600" text-anchor="middle" data-max-width="460" >Tra cứu / quản lý KB</text><text x="661" y="1638" fill="#536B82" font-size="16" font-weight="400" text-anchor="middle" data-max-width="460" >Published / version / ACL hiện tại</text></g><text x="346" y="1700" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1198" >Publisher là capability; vai trò được phép biên soạn/xuất bản còn cần quyết định D-40, không là role thứ năm.</text><path d="M 56 1795 L 1544 1795" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1827" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >Nguồn: UC catalog · Ma trận quyền · BR-01–22</text><text x="56" y="1857" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >Association là tham gia, không là thứ tự xử lý • AI và scheduler là thành phần nội bộ</text></g></svg>