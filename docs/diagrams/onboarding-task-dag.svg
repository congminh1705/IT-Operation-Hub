<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title desc" data-figure-id="FIG-DAG01"><title id="title">Onboarding: task, phụ thuộc và trách nhiệm</title><desc id="desc">Dữ liệu DEMO cho 10 nhân viên mới • Công sức mẫu chỉ để đọc DAG; chưa được xác nhận làm policy vận hành.. Thiết kế mục tiêu, chưa triển khai.</desc><metadata id="documentation-contract">{&quot;figure_id&quot;: &quot;FIG-DAG01&quot;, &quot;notation&quot;: &quot;task-dependency-dag&quot;, &quot;status&quot;: &quot;design-draft&quot;, &quot;authority&quot;: &quot;derived&quot;, &quot;sources&quot;: [&quot;docs/05-user-flows.md&quot;, &quot;docs/requirements/business-rules.md&quot;, &quot;docs/requirements/conceptual-data-model.md&quot;], &quot;documentation_standard&quot;: &quot;docs/documentation-standard.md&quot;, &quot;implementation&quot;: &quot;not-started&quot;, &quot;demo&quot;: true, &quot;tasks&quot;: [&quot;T01&quot;, &quot;T02&quot;, &quot;T03&quot;, &quot;T04&quot;, &quot;T05&quot;, &quot;T06&quot;]}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98"/></marker></defs><rect x="0" y="0" width="1600" height="1460" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="56" y="42" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488" >IT OPERATIONS HUB  /  FIG-DAG01</text><text x="56" y="92" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488" >Onboarding: task, phụ thuộc và trách nhiệm</text><text x="56" y="126" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488" >Dữ liệu DEMO cho 10 nhân viên mới • Công sức mẫu chỉ để đọc DAG; chưa được xác nhận làm policy vận hành.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="request" data-x="64" data-y="236" data-width="350" data-height="154"><rect x="64" y="236" width="350" height="154" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="64" y="236" width="5" height="154" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="84" y="262" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="310" >ĐẦU VÀO DEMO</text><text x="84" y="292" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="310" >Ticket đã xác nhận</text><text x="84" y="323" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310" >Danh sách + cấu hình + hạn đã đủ;</text><text x="84" y="346" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310" >template Published đúng quyền</text></g><g class="diagram-node" data-node="t1" data-x="548" data-y="236" data-width="420" data-height="158"><rect x="548" y="236" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="236" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="568" y="262" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380" >TASK / DEMO</text><text x="568" y="292" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380" >T01 · Kiểm kê 10 máy</text><text x="568" y="323" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >30 phút · Technician / hardware. Thiếu</text><text x="568" y="346" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >inventory → ngoại lệ, không giả là có</text><text x="568" y="369" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >máy.</text></g><g class="diagram-node" data-node="t2" data-x="1116" data-y="236" data-width="420" data-height="158"><rect x="1116" y="236" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1116" y="236" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="1136" y="262" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380" >TASK / DEMO</text><text x="1136" y="292" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380" >T02 · Chuẩn bị máy</text><text x="1136" y="323" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >120 phút · Technician / hardware. Chỉ</text><text x="1136" y="346" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >Ready khi T01 Done.</text></g><g class="diagram-node" data-node="t3" data-x="1116" data-y="558" data-width="420" data-height="158"><rect x="1116" y="558" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1116" y="558" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="1136" y="584" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380" >TASK / DEMO</text><text x="1136" y="614" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380" >T03 · Cài đặt cấu hình</text><text x="1136" y="645" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >180 phút · Technician / software. Chỉ</text><text x="1136" y="668" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >Ready khi T02 Done.</text></g><g class="diagram-node" data-node="t4" data-x="548" data-y="558" data-width="420" data-height="158"><rect x="548" y="558" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="558" width="5" height="158" rx="2" fill="#7250AB" stroke="none" stroke-width="1.5" /><text x="568" y="584" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="380" >TASK / DEMO</text><text x="568" y="614" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380" >T04 · Cấp tài khoản</text><text x="568" y="645" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >60 phút · Admin. Xác minh đề nghị và</text><text x="568" y="668" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >thẩm quyền; AI chỉ giao task.</text></g><g class="diagram-node" data-node="t5" data-x="1116" data-y="880" data-width="420" data-height="158"><rect x="1116" y="880" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1116" y="880" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="1136" y="906" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380" >TASK / DEMO</text><text x="1136" y="936" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380" >T05 · Kiểm tra tích hợp</text><text x="1136" y="967" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >60 phút · IT có quyền. Chờ T03 và T04</text><text x="1136" y="990" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >Done; cần kết quả kiểm tra.</text></g><g class="diagram-node" data-node="t6" data-x="548" data-y="880" data-width="420" data-height="158"><rect x="548" y="880" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="880" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="568" y="906" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380" >TASK / DEMO</text><text x="568" y="936" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380" >T06 · Bàn giao</text><text x="568" y="967" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >60 phút · IT có quyền. Chờ T05 Done; ghi</text><text x="568" y="990" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380" >kết quả bàn giao.</text></g><path d="M 414 313 L 548 313" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="input-hardware" data-from="request" data-to="T01"/><path d="M 968 313 L 1116 313" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="inventory" data-from="T01" data-to="T02"/><path d="M 1326 394 L 1326 558" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="install" data-from="T02" data-to="T03"/><path d="M 239 390 L 239 637 L 548 637" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="account" data-from="request" data-to="T04"/><path d="M 1326 716 L 1326 880" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="device-verify" data-from="T03" data-to="T05"/><path d="M 758 716 L 758 800 L 1200 800 L 1200 880" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="account-verify" data-from="T04" data-to="T05"/><path d="M 1116 959 L 968 959" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="handover" data-from="T05" data-to="T06"/><rect x="980" y="262" width="129" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="987" y="280" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="115" >T01 Done</text><rect x="1343" y="457" width="174" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1350" y="475" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="160" >T02 Done</text><rect x="1343" y="778" width="174" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1350" y="796" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="160" >T03 Done</text><rect x="801" y="765" width="224" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="808" y="783" fill="#7250AB" font-size="16" font-weight="400" text-anchor="start" data-max-width="210" >T04 Done</text><rect x="980" y="908" width="130" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="987" y="926" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="116" >T05 Done</text><rect x="64" y="800" width="350" height="212" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="84" y="830" fill="#7250AB" font-size="17" font-weight="700" text-anchor="start" data-max-width="310" >Nhánh có thể song song</text><text x="84" y="858" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310" >T04 không phải chờ cài máy nếu</text><text x="84" y="881" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310" >đầu vào cấp user đã được xác</text><text x="84" y="904" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310" >minh. Không suy quyền Admin từ</text><text x="84" y="927" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310" >policy AI.</text><g class="diagram-node" data-node="finish" data-x="548" data-y="1178" data-width="988" data-height="134"><rect x="548" y="1178" width="988" height="134" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="1178" width="5" height="134" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="568" y="1204" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="948" >HAI NGHIỆP VỤ RIÊNG</text><text x="568" y="1234" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="948" >Hoàn thành task chưa phải đóng ticket</text><text x="568" y="1265" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="948" >IT có quyền ghi giải pháp → Resolved; chính requester thử và xác nhận → Closed. Không có cạnh AI tự</text><text x="568" y="1288" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="948" >nghiệm thu.</text></g><path d="M 758 1038 L 758 1178" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="775" y="1095" width="434" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="782" y="1113" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="420" >Kết quả đủ; không tự đóng ticket</text><path d="M 56 1366 L 1544 1366" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1398" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >Nguồn: Flow 8 / ví dụ DEMO · BR-04/14/15/16/20 · UC19/20</text><text x="56" y="1428" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >DAG logic, không phải lịch cố định • Candidate/effort/calendar/capacity vẫn phải được kiểm trước mỗi assignment</text></g></svg>