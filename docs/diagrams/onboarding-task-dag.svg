<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title desc" data-figure-id="FIG-DAG01"><title id="title">Onboarding: tasks, dependencies, responsibility</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-DAG01", "notation": "task-dependency-dag", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/requirements/conceptual-data-model.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "demo": true, "tasks": ["T01", "T02", "T03", "T04", "T05", "T06"], "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1460" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-DAG01</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Onboarding: tasks, dependencies, responsibility</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">DEMO for 10 new employees • Sample effort illustrates dependencies, not approved operational policy.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="request" data-x="64" data-y="236" data-width="350" data-height="154"><rect x="64" y="236" width="350" height="154" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="64" y="236" width="5" height="154" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="84" y="262.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="310">DEMO INPUT</text><text x="84" y="292.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="310">Confirmed ticket</text><text x="84" y="323.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">Complete employee</text><text x="84" y="346.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">list/configuration/deadline; authorized</text><text x="84" y="369.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">Published template</text></g><g class="diagram-node" data-node="t1" data-x="548" data-y="236" data-width="420" data-height="158"><rect x="548" y="236" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="236" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="568" y="262.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380">TASK / DEMO</text><text x="568" y="292.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380">T01 · Inventory 10 devices</text><text x="568" y="323.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">30 minutes · Hardware Technician. Stock shortage</text><text x="568" y="346.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">→ exception, never fabricated devices.</text></g><g class="diagram-node" data-node="t2" data-x="1116" data-y="236" data-width="420" data-height="158"><rect x="1116" y="236" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1116" y="236" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="1136" y="262.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380">TASK / DEMO</text><text x="1136" y="292.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380">T02 · Prepare devices</text><text x="1136" y="323.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">120 minutes · Hardware Technician. Ready only</text><text x="1136" y="346.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">after T01 Done.</text></g><g class="diagram-node" data-node="t3" data-x="1116" data-y="558" data-width="420" data-height="158"><rect x="1116" y="558" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1116" y="558" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="1136" y="584.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380">TASK / DEMO</text><text x="1136" y="614.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380">T03 · Install configuration</text><text x="1136" y="645.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">180 minutes · Software Technician. Ready only</text><text x="1136" y="668.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">after T02 Done.</text></g><g class="diagram-node" data-node="t4" data-x="548" data-y="558" data-width="420" data-height="158"><rect x="548" y="558" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="558" width="5" height="158" rx="2" fill="#7250AB" stroke="none" stroke-width="1.5" /><text x="568" y="584.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="380">TASK / DEMO</text><text x="568" y="614.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380">T04 · Provision accounts</text><text x="568" y="645.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">60 minutes · Admin. Verify request/authority; AI</text><text x="568" y="668.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">assigns the task only.</text></g><g class="diagram-node" data-node="t5" data-x="1116" data-y="880" data-width="420" data-height="158"><rect x="1116" y="880" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1116" y="880" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="1136" y="906.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380">TASK / DEMO</text><text x="1136" y="936.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380">T05 · Integration testing</text><text x="1136" y="967.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">60 minutes · Authorized IT. Wait for T03 and T04</text><text x="1136" y="990.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">Done; record test results.</text></g><g class="diagram-node" data-node="t6" data-x="548" data-y="880" data-width="420" data-height="158"><rect x="548" y="880" width="420" height="158" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="880" width="5" height="158" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="568" y="906.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="380">TASK / DEMO</text><text x="568" y="936.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="380">T06 · Handover</text><text x="568" y="967.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">60 minutes · Authorized IT. Wait for T05 Done;</text><text x="568" y="990.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="380">record handover results.</text></g><path d="M 414 313 L 548 313" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="input-hardware" data-from="request" data-to="T01" /><path d="M 968 313 L 1116 313" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="inventory" data-from="T01" data-to="T02" /><path d="M 1326 394 L 1326 558" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="install" data-from="T02" data-to="T03" /><path d="M 239 390 L 239 637 L 548 637" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="account" data-from="request" data-to="T04" /><path d="M 1326 716 L 1326 880" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="device-verify" data-from="T03" data-to="T05" /><path d="M 758 716 L 758 800 L 1200 800 L 1200 880" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="account-verify" data-from="T04" data-to="T05" /><path d="M 1116 959 L 968 959" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-dependency="handover" data-from="T05" data-to="T06" /><rect x="980" y="262" width="129" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="987" y="280.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="115">T01 Done</text><rect x="1343" y="457" width="174" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1350" y="475.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="160">T02 Done</text><rect x="1343" y="778" width="174" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1350" y="796.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="160">T03 Done</text><rect x="801" y="765" width="224" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="808" y="783.0" fill="#7250AB" font-size="16" font-weight="400" text-anchor="start" data-max-width="210">T04 Done</text><rect x="980" y="908" width="130" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="987" y="926.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="116">T05 Done</text><rect x="64" y="800" width="350" height="212" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="84" y="830.0" fill="#7250AB" font-size="17" font-weight="700" text-anchor="start" data-max-width="310">Branches may run in parallel</text><text x="84" y="858.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">T04 may run before device installation if</text><text x="84" y="881.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">account inputs verified. AI policy does</text><text x="84" y="904.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">not grant Admin rights.</text><g class="diagram-node" data-node="finish" data-x="548" data-y="1178" data-width="988" data-height="134"><rect x="548" y="1178" width="988" height="134" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="1178" width="5" height="134" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="568" y="1204.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="948">TWO SEPARATE LIFECYCLES</text><text x="568" y="1234.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="948">Task completion is not ticket closure</text><text x="568" y="1265.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="948">Authorized IT solution → Resolved; original requester tests/accepts → Closed. No autonomous AI acceptance.</text></g><path d="M 758 1038 L 758 1178" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="775" y="1095" width="434" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="782" y="1113.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="420">Complete result; no ticket auto-close</text><path d="M 56 1366 L 1544 1366" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1398.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: Flow 8 / DEMO example · BR-04/14/15/16/20 · UC19/20</text><text x="56" y="1428.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Logical DAG, not a fixed schedule • Recheck candidates/effort/calendar/capacity before every assignment</text></g></svg>