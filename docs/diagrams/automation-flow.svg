<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW01"><title id="title">Request to assigned tasks</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW01", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/technical/api-design.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW01</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Request to assigned tasks</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">Main and exception paths • Ticket commits first; plans/assignments take effect only after domain commit.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="ticket" data-x="548" data-y="218" data-width="500" data-height="116"><rect x="548" y="218" width="500" height="116" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="218" width="5" height="116" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="568" y="244.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">REQUESTER → TICKET SERVICE</text><text x="568" y="274.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Confirm request</text><text x="568" y="305.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">API03 / API13 → ticket New + SLA + EVT01</text></g><g class="diagram-node" data-node="input" data-x="548" data-y="410" data-width="500" data-height="132"><rect x="548" y="410" width="500" height="132" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="410" width="5" height="132" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="568" y="436.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">AI + SCOPED READ SERVICE</text><text x="568" y="466.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Understand goal, deadline, and data</text><text x="568" y="497.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Read scoped ticket; identify missing fields</text></g><path d="M 798 334 L 798 410" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="815" y="358" width="314" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="822" y="376.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="300">Committed; event/outbox</text><g class="diagram-decision" data-node="complete"><polygon points="798,590.0 943.0,656 798,722.0 653.0,656" fill="#F3F7FF" stroke="#2457C5" stroke-width="2" /><text x="798" y="662.0" fill="#2457C5" font-size="19" font-weight="600" text-anchor="middle" data-max-width="203.0">Inputs complete?</text></g><path d="M 798 542 L 798 590" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><g class="diagram-node" data-node="question" data-x="64" data-y="590" data-width="350" data-height="156"><rect x="64" y="590" width="350" height="156" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="64" y="590" width="5" height="156" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="84" y="616.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="310">AI ASKS / REQUESTER CLARIFIES</text><text x="84" y="646.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="310">Ask / add information</text><text x="84" y="677.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">Missing staff, setup or deadline:</text><text x="84" y="700.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">request structured details;</text><text x="84" y="723.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">never invent inputs.</text></g><path d="M 653 656 L 414 656" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="440" y="606" width="144" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="447" y="624.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="130">No</text><path d="M 64 690 L 32 690 L 32 476 L 548 476" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="63" y="430" width="364" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="70" y="448.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="350">EVT02; deduplicated questions</text><g class="diagram-node" data-node="source" data-x="548" data-y="784" data-width="500" data-height="130"><rect x="548" y="784" width="500" height="130" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="784" width="5" height="130" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="568" y="810.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN SERVICES</text><text x="568" y="840.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Filtered sources and candidates</text><text x="568" y="871.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Published template/KB + ACL; valid skills/schedule/role</text></g><path d="M 798 722 L 798 784" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="815" y="738" width="114" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="822" y="756.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="100">Yes</text><g class="diagram-node" data-node="policy" data-x="1150" data-y="248" data-width="386" data-height="196"><rect x="1150" y="248" width="386" height="196" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1150" y="248" width="5" height="196" rx="2" fill="#7250AB" stroke="none" stroke-width="1.5" /><text x="1170" y="274.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="346">IT MANAGER</text><text x="1170" y="304.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="346">IT Manager sets policies</text><text x="1170" y="362.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">Workflow/ team/ priority/ actions/ limits/</text><text x="1170" y="385.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">grantor/ version. Default deny without a valid</text><text x="1170" y="408.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">grant.</text></g><path d="M 1150 346 L 1110 346 L 1110 848 L 1048 848" fill="none" stroke="#7250AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr)" /><rect x="1123" y="608" width="394" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1130" y="626.0" fill="#7250AB" font-size="16" font-weight="400" text-anchor="start" data-max-width="380">Control sources; no per-step approval</text><g class="diagram-node" data-node="model" data-x="548" data-y="996" data-width="500" data-height="154"><rect x="548" y="996" width="500" height="154" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="996" width="5" height="154" rx="2" fill="#7250AB" stroke="none" stroke-width="1.5" /><text x="568" y="1022.0" fill="#7250AB" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">AI ADAPTER</text><text x="568" y="1052.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Model proposes plan / DAG / ranking</text><text x="568" y="1083.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Close read transaction → reserve budget → call adapter;</text><text x="568" y="1106.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">model never writes database</text></g><path d="M 798 914 L 798 996" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="815" y="940" width="334" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="822" y="958.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="320">Source / candidates / versions</text><rect x="64" y="994" width="350" height="180" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="84" y="1024.0" fill="#B74B50" font-size="17" font-weight="700" text-anchor="start" data-max-width="310">Provider / schema failure</text><text x="84" y="1052.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">Record run/error; bounded transient</text><text x="84" y="1075.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">retries. No partial tasks/assignments. See</text><text x="84" y="1098.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">FIG-SEQ01.</text><g class="diagram-node" data-node="check" data-x="548" data-y="1226" data-width="500" data-height="146"><rect x="548" y="1226" width="500" height="146" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="1226" width="5" height="146" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="568" y="1252.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN SERVICES</text><text x="568" y="1282.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Revalidate before effect</text><text x="568" y="1313.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">New transaction: rights/ grants/ versions/ DAG/ schedule/</text><text x="568" y="1336.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">capacity/ inventory/ SLA/ deadline</text></g><path d="M 798 1150 L 798 1226" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="815" y="1174" width="444" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="822" y="1192.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="430">Schema- and semantics-validated output</text><g class="diagram-decision" data-node="allowed"><polygon points="798,1412.0 953.0,1482 798,1552.0 643.0,1482" fill="#F3F7FF" stroke="#2457C5" stroke-width="2" /><text x="798" y="1488.0" fill="#2457C5" font-size="19" font-weight="600" text-anchor="middle" data-max-width="217.0">Authorized + feasible?</text></g><path d="M 798 1372 L 798 1412" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><g class="diagram-node" data-node="exception" data-x="1150" data-y="1398" data-width="386" data-height="194"><rect x="1150" y="1398" width="386" height="194" rx="12" fill="#FFFAF2" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1150" y="1398" width="5" height="194" rx="2" fill="#A86B12" stroke="none" stroke-width="1.5" /><text x="1170" y="1424.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="346">IT MANAGER</text><text x="1170" y="1454.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="346">Draft / actionable exception</text><text x="1170" y="1485.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">Resource shortage,</text><text x="1170" y="1508.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">active/locked/out-of-scope work →</text><text x="1170" y="1531.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">before/after/impact proposal; approval still</text><text x="1170" y="1554.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">rechecks.</text></g><path d="M 953 1482 L 1150 1482" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="965" y="1422" width="174" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="972" y="1440.0" fill="#A86B12" font-size="16" font-weight="400" text-anchor="start" data-max-width="160">No</text><path d="M 1343 1398 L 1343 1299 L 1048 1299" fill="none" stroke="#7250AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr)" /><rect x="1118" y="1252" width="394" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1125" y="1270.0" fill="#7250AB" font-size="16" font-weight="400" text-anchor="start" data-max-width="380">Approved → recheck; no overbooking</text><g class="diagram-node" data-node="commit" data-x="548" data-y="1604" data-width="500" data-height="142"><rect x="548" y="1604" width="500" height="142" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="548" y="1604" width="5" height="142" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="568" y="1630.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="460">DOMAIN SERVICES</text><text x="568" y="1660.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="460">Activate plan and assign tasks</text><text x="568" y="1691.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">Atomic domain + allocation + action + audit + outbox;</text><text x="568" y="1714.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="460">EVT03/04; idempotent intent</text></g><path d="M 798 1552 L 798 1604" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="813" y="1567" width="114" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="820" y="1585.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="100">Yes</text><g class="diagram-node" data-node="work" data-x="64" data-y="1505" data-width="350" data-height="223"><rect x="64" y="1505" width="350" height="223" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="64" y="1505" width="5" height="223" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="84" y="1531.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="310">TECHNICIAN / ADMIN</text><text x="84" y="1561.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="310">Accept and perform specialist</text><text x="84" y="1588.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="310">work</text><text x="84" y="1619.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">Dependencies guard start; versioned</text><text x="84" y="1642.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">progress/Blocked/Done with results.</text><text x="84" y="1665.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">Admin performs authorized user</text><text x="84" y="1688.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="310">provisioning.</text></g><path d="M 548 1674 L 414 1674" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="1150" y="1630" width="386" height="112" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="1170" y="1660.0" fill="#087F80" font-size="17" font-weight="700" text-anchor="start" data-max-width="346">Monitor and complete</text><text x="1170" y="1688.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">EVT05–13 → FIG-FLOW02. Task DAG →</text><text x="1170" y="1711.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">FIG-DAG01. IT proposes Resolved; requester</text><text x="1170" y="1734.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="346">confirms Closed.</text><path d="M 56 1806 L 1544 1806" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1838.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: Flow 8–10 · UC-OPS03–08 · BR-14–20 · API03/05/06/11/13</text><text x="56" y="1868.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">No policy / infeasible: no effective assignment • No autonomous AI Done / Resolved / Closed</text></g></svg>