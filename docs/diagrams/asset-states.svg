<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc" data-figure-id="FIG-ST04"><title id="title">Tài sản: trạng thái và lịch sử cấp phát</title><desc id="desc">04 trạng thái • M/A thay đổi có lý do • Assignment hiệu lực là dữ liệu được kiểm tra, không phải nhãn giao diện.. Thiết kế mục tiêu, chưa triển khai.</desc><metadata id="documentation-contract">{&quot;figure_id&quot;: &quot;FIG-ST04&quot;, &quot;notation&quot;: &quot;state-transition-view&quot;, &quot;status&quot;: &quot;design-draft&quot;, &quot;authority&quot;: &quot;derived&quot;, &quot;sources&quot;: [&quot;docs/requirements/business-rules.md&quot;], &quot;documentation_standard&quot;: &quot;docs/documentation-standard.md&quot;, &quot;implementation&quot;: &quot;not-started&quot;}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98"/></marker></defs><rect x="0" y="0" width="1600" height="1280" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="56" y="42" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488" >IT OPERATIONS HUB  /  FIG-ST04</text><text x="56" y="92" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488" >Tài sản: trạng thái và lịch sử cấp phát</text><text x="56" y="126" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488" >04 trạng thái • M/A thay đổi có lý do • Assignment hiệu lực là dữ liệu được kiểm tra, không phải nhãn giao diện.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="stock" data-x="64" data-y="320" data-width="360" data-height="154"><rect x="64" y="320" width="360" height="154" rx="12" f