rect x="998" y="479" width="157" height="54" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1005" y="497" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="143" >Sửa xong; còn</text><text x="1005" y="519" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="143" >holder</text><rect x="557" y="207" width="514" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="564" y="225" fill="#A86B12" font-size="16" font-weight="400" text-anchor="start" data-max-width="500" >Bảo trì khi chưa có assignment</text><rect x="523" y="578" width="654" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="530" y="596" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="640" >Sửa xong / thu hồi: không còn assignment → Trong kho</text><rect x="193" y="717" width="394" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="200" y="735" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="380" >Không assignment; lý do</text><rect x="963" y="717" width="394" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="970" y="735" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="380" >Thu hồi trước khi ngừng</text><rect x="56" y="1075" width="1488" height="95" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="76" y="1105" fill="#087F80" font-size="17" font-weight="700" text-anchor="start" data-max-width="1448" >Bất biến cấp phát</text><text x="76" y="1133" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="1448" >Hai lượt cấp đồng thời chỉ một thành công. Không sửa tay holder trong asset metadata; thu hồi kết thúc assignment và giữ lịch sử.</text><path d="M 56 1186 L 1544 1186" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1218" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >Nguồn: BR-11 · UC27–31 · API15 · AC35–40</text><text x="56" y="1248" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >AI không tự cấp phát • Chưa đặc tả cạnh tái kích hoạt tài sản ngừng sử dụng</text></g></svg>