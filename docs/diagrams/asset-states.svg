dth="1.5" /><text x="84" y="346.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="320">ASSET STATE</text><text x="84" y="376.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="320">Trong kho</text><text x="84" y="407.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="320">No active assignment; new issue allowed</text></g><g class="diagram-node" data-node="in-use" data-x="620" data-y="320" data-width="360" data-height="154"><rect x="620" y="320" width="360" height="154" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="620" y="320" width="5" height="154" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="640" y="346.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="320">ASSET STATE</text><text x="640" y="376.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="320">In Use</text><text x="640" y="407.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="320">Exactly one active assignment required</text></g><g class="diagram-node" data-node="repair" data-x="1176" data-y="320" data-width="360" data-height="154"><rect x="1176" y="320" width="360" height="154" rx="12" fill="#FFFAF2" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1176" y="320" width="5" height="154" rx="2" fill="#A86B12" stroke="none" stroke-width="1.5" /><text x="1196" y="346.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="320">ASSET STATE</text><text x="1196" y="376.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="320">Under Repair</text><text x="1196" y="407.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="320">No new issue; may retain holder</text></g><g class="diagram-node" data-node="retired" data-x="620" data-y="888" data-width="360" data-heigh