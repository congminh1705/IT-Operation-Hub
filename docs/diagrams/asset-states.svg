one" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="In Stock" data-to="Retired" /><path d="M 1430 474 L 1430 760 L 885 760 L 885 888" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" data-from="Under Repair" data-to="Retired" /><rect x="443" y="309" width="157" height="54" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="450" y="327.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="143">Issue; active user</text><rect x="443" y="479" width="159" height="54" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="450" y="497.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="145">Return assignment</text><rect x="998" y="309" width="157" height="54" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1005" y="327.0" fill="#A86B12" font-size="16" font-weight="400" text-anchor="start" data-max-width="143">Repair; retain holder</text><rect x="998" y="479" width="157" height="54" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1005" y="497.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="143">Repair complete;</text><text x="1005" y="519.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="143">holder retained</text><rect x="557" y="207" width="514" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="564" y="225.0" fill="#A86B12" font-size="16" font-weight="400" text-anchor="start" data-max-width="500">Maintenance without assignment</text><rect x="523" y="578" width="654" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="530" y="596.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="640">Repair complete / returned: no assignment → In Stock</text><rect x="193" y="717" width="394" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="200" y="735.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="380">No assignment; reason required</text><rect x="963" y="717" width="394" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="970" y="735.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="380">Return before retirement</text><rect x="56" y="1075" width="1488" height="95" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="76" y="1105.0" fill="#087F80" font-size="17" font-weight="700" text-anchor="start" data-max-width="1448">Asset assignment invariants</text><text x="76" y="1133.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="1448">One concurrent issue succeeds. No metadata holder edits; returns end assignments and preserve history.</text><path d="M 56 1186 L 1544 1186" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1218.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: BR-11 · UC27–31 · API15 · AC35–40</text><text x="56" y="1248.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">No autonomous AI issue • Retired-asset reactivation is not specified</text></g></svg>