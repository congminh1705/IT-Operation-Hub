<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1710" viewBox="0 0 1600 1710" role="img" aria-labelledby="title desc" data-figure-id="FIG-FLOW02"><title id="title">Absence: controlled reassignment</title><desc id="desc">Target design documentation. English diagram labels; not implemented or tested on an application. Sources are recorded in metadata.</desc><metadata id="documentation-contract">{"figure_id": "FIG-FLOW02", "notation": "activity-flow", "status": "design-draft", "authority": "derived", "sources": ["docs/05-user-flows.md", "docs/requirements/business-rules.md", "docs/technical/api-design.md"], "documentation_standard": "docs/documentation-standard.md", "implementation": "not-started", "demo": true, "language": "en", "updated": "2026-11-01"}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#637D98" /></marker></defs><rect x="0" y="0" width="1600" height="1710" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="56" y="42.0" fill="#2457C5" font-size="14" font-weight="700" text-anchor="start" data-max-width="1488">IT OPERATIONS HUB / FIG-FLOW02</text><text x="56" y="92.0" fill="#14283F" font-size="32" font-weight="700" text-anchor="start" data-max-width="1488">Absence: controlled reassignment</text><text x="56" y="126.0" fill="#536B82" font-size="18" font-weight="400" text-anchor="start" data-max-width="1488">EVT08 availability.changed • Auto-reassign only unstarted, unlocked tasks within current policy.</text><path d="M 56 166 L 1544 166" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="diagram-node" data-node="event" data-x="610" data-y="232" data-width="410" data-height="130"><rect x="610" y="232" width="410" height="130" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="610" y="232" width="5" height="130" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="630" y="258.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="370">WORKFORCE → EVT08</text><text x="630" y="288.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="370">Schedule changed, new version</text><text x="630" y="319.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">Commit absence + audit/outbox; identify</text><text x="630" y="342.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">affected tasks</text></g><g class="diagram-node" data-node="affected" data-x="610" data-y="442" data-width="410" data-height="144"><rect x="610" y="442" width="410" height="144" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="610" y="442" width="5" height="144" rx="2" fill="#2457C5" stroke="none" stroke-width="1.5" /><text x="630" y="468.0" fill="#2457C5" font-size="13" font-weight="700" text-anchor="start" data-max-width="370">WORKER / AI_COORDINATOR</text><text x="630" y="498.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="370">Read tasks / plans / allocations</text><text x="630" y="529.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">Check state, manual lock, deadline,</text><text x="630" y="552.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">dependencies, grant; never use stale snapshots</text></g><path d="M 815 362 L 815 442" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><g class="diagram-decision" data-node="movable"><polygon points="815,635.0 975.0,708 815,781.0 655.0,708" fill="#F3F7FF" stroke="#2457C5" stroke-width="2" /><text x="815" y="714.0" fill="#2457C5" font-size="19" font-weight="600" text-anchor="middle" data-max-width="224.0">Unstarted and unlocked?</text></g><path d="M 815 586 L 815 635" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><g class="diagram-node" data-node="candidates" data-x="64" data-y="638" data-width="380" data-height="184"><rect x="64" y="638" width="380" height="184" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="64" y="638" width="5" height="184" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="84" y="664.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="340">DOMAIN SERVICES</text><text x="84" y="694.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="340">Filter eligible candidates</text><text x="84" y="725.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">Active + action-authorized role + team +</text><text x="84" y="748.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">verified skill + schedule window; rank only</text><text x="84" y="771.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="340">eligible IDs</text></g><path d="M 655 708 L 444 708" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="474" y="663" width="114" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="481" y="681.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="100">Yes</text><g class="diagram-node" data-node="protected" data-x="1170" data-y="638" data-width="366" data-height="184"><rect x="1170" y="638" width="366" height="184" rx="12" fill="#FFFAF2" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1170" y="638" width="5" height="184" rx="2" fill="#A86B12" stroke="none" stroke-width="1.5" /><text x="1190" y="664.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="326">EXCEPTION / M/A</text><text x="1190" y="694.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="326">Respect manual decisions</text><text x="1190" y="725.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">In-progress/locked tasks: propose</text><text x="1190" y="748.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">before/after impacts, never auto-reassign.</text><text x="1190" y="771.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">Escalate where required.</text></g><path d="M 975 708 L 1170 708" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="1008" y="663" width="134" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1015" y="681.0" fill="#A86B12" font-size="16" font-weight="400" text-anchor="start" data-max-width="120">No</text><g class="diagram-decision" data-node="feasible"><polygon points="815,924.0 980.0,1000 815,1076.0 650.0,1000" fill="#F3F7FF" stroke="#2457C5" stroke-width="2" /><text x="815" y="994.0" fill="#2457C5" font-size="19" font-weight="600" text-anchor="middle" data-max-width="230.99999999999997">Feasible candidate +</text><text x="815" y="1018.0" fill="#2457C5" font-size="19" font-weight="600" text-anchor="middle" data-max-width="230.99999999999997">policy?</text></g><path d="M 254 822 L 254 900 L 815 900 L 815 924" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><g class="diagram-node" data-node="no-solution" data-x="1170" data-y="930" data-width="366" data-height="210"><rect x="1170" y="930" width="366" height="210" rx="12" fill="#FFFAF2" stroke="#D9E3ED" stroke-width="1.5" /><rect x="1170" y="930" width="5" height="210" rx="2" fill="#A86B12" stroke="none" stroke-width="1.5" /><text x="1190" y="956.0" fill="#A86B12" font-size="13" font-weight="700" text-anchor="start" data-max-width="326">EXCEPTION / M/A</text><text x="1190" y="986.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="326">Never force execution</text><text x="1190" y="1017.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">Shortage, exceeded scope/commitments,</text><text x="1190" y="1040.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">disabled policy: retain proposal/error;</text><text x="1190" y="1063.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">management adjusts or handles manually.</text></g><path d="M 980 1000 L 1170 1000" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="1011" y="952" width="134" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="1018" y="970.0" fill="#A86B12" font-size="16" font-weight="400" text-anchor="start" data-max-width="120">No</text><g class="diagram-node" data-node="write" data-x="610" data-y="1192" data-width="410" data-height="166"><rect x="610" y="1192" width="410" height="166" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="610" y="1192" width="5" height="166" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="630" y="1218.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="370">DOMAIN TRANSACTION</text><text x="630" y="1248.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="370">Re-read and reserve atomically</text><text x="630" y="1279.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">Lock resources; recheck version/schedule/load;</text><text x="630" y="1302.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">commit assignment/allocation +</text><text x="630" y="1325.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">action/audit/outbox; EVT04</text></g><path d="M 815 1076 L 815 1192" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="831" y="1124" width="344" height="32" rx="4" fill="white" stroke="none" stroke-width="1.5" /><text x="838" y="1142.0" fill="#087F80" font-size="16" font-weight="400" text-anchor="start" data-max-width="330">Yes; still valid at commit</text><rect x="64" y="970" width="430" height="258" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="84" y="1000.0" fill="#087F80" font-size="17" font-weight="700" text-anchor="start" data-max-width="390">DEMO example · 10:00–14:00 window</text><text x="84" y="1028.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">T03 unstarted, remaining 180m. A absent. B</text><text x="84" y="1051.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">busy10–11, free11–14=180m: eligible. C</text><text x="84" y="1074.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">free12–14=120m: excluded. Check</text><text x="84" y="1097.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390">dependencies/deadline too.</text><rect x="1170" y="1230" width="366" height="160" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="1190" y="1260.0" fill="#7250AB" font-size="17" font-weight="700" text-anchor="start" data-max-width="326">If approved</text><text x="1190" y="1288.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">Revalidate with fresh snapshot; preserve</text><text x="1190" y="1311.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">locks/capacity. Separate decision/execution</text><text x="1190" y="1334.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326">in FIG-ST02 / SEQ02.</text><g class="diagram-node" data-node="notify" data-x="610" data-y="1438" data-width="410" data-height="130"><rect x="610" y="1438" width="410" height="130" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="610" y="1438" width="5" height="130" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="630" y="1464.0" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="370">SAU COMMIT</text><text x="630" y="1494.0" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="370">Update assignee</text><text x="630" y="1525.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">Deduplicated notification; continue event</text><text x="630" y="1548.0" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370">monitoring</text></g><path d="M 815 1358 L 815 1438" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M 56 1616 L 1544 1616" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1648.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">Source: Flow 9 / DEMO example · BR-16–19 · API06/07/09/11 · EVT04/08</text><text x="56" y="1678.0" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488">free = capacity − load per period/slot • Sufficient total minutes still needs a feasible execution window</text></g></svg>