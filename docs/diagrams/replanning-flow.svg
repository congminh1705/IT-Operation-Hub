width="390" >180 phút → đủ. C chỉ rảnh 12–14 = 120</text><text x="84" y="1097" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390" >phút → loại. Còn phải kiểm dependency và</text><text x="84" y="1120" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="390" >deadline.</text><rect x="1170" y="1230" width="366" height="160" rx="10" fill="#F7F9FC" stroke="#D9E3ED" stroke-width="1.5" /><text x="1190" y="1260" fill="#7250AB" font-size="17" font-weight="700" text-anchor="start" data-max-width="326" >Nếu được duyệt</text><text x="1190" y="1288" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326" >Quay lại revalidate bằng snapshot</text><text x="1190" y="1311" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326" >mới, không bỏ lock hoặc ép vượt</text><text x="1190" y="1334" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326" >capacity. Decision và execution</text><text x="1190" y="1357" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="326" >riêng tại FIG-ST02 / SEQ02.</text><g class="diagram-node" data-node="notify" data-x="610" data-y="1438" data-width="410" data-height="130"><rect x="610" y="1438" width="410" height="130" rx="12" fill="#F5F8FD" stroke="#D9E3ED" stroke-width="1.5" /><rect x="610" y="1438" width="5" height="130" rx="2" fill="#087F80" stroke="none" stroke-width="1.5" /><text x="630" y="1464" fill="#087F80" font-size="13" font-weight="700" text-anchor="start" data-max-width="370" >SAU COMMIT</text><text x="630" y="1494" fill="#14283F" font-size="21" font-weight="600" text-anchor="start" data-max-width="370" >Cập nhật người thực hiện</text><text x="630" y="1525" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370" >Notification chống trùng; theo dõi tiếp</text><text x="630" y="1548" fill="#536B82" font-size="17" font-weight="400" text-anchor="start" data-max-width="370" >qua event</text></g><path d="M 815 1358 L 815 1438" fill="none" stroke="#93A8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M 56 1616 L 1544 1616" fill="none" stroke="#D9E3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="1648" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >Nguồn: Flow 9 / ví dụ DEMO · BR-16–19 · API06/07/09/11 · EVT04/08</text><text x="56" y="1678" fill="#536B82" font-size="16" font-weight="400" text-anchor="start" data-max-width="1488" >free = capacity − load theo từng kỳ/slot • Tổng đủ phút vẫn phải có cửa sổ thực thi khả thi</text></g></svg>