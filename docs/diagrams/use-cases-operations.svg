<text x="787" y="798" font-size="12" fill="#1D4ED8" font-weight="700" text-anchor="middle">01</text>
<text x="819" y="797" font-size="17" fill="#15263D" font-weight="600" text-anchor="start">Một lượt cấp phát hiệu lực</text>
<text x="770" y="826" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Mỗi tài sản tối đa một assignment đang hoạt động.</text>
<text x="770" y="848" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Cấp phát và thu hồi phải giữ đúng lịch sử.</text>
<rect x="752" y="888" width="636" height="110" rx="12" fill="#F5F8FD"/>
<rect x="770" y="905" width="34" height="30" rx="9" fill="#E8EFFF"/>
<text x="787" y="926" font-size="12" fill="#1D4ED8" font-weight="700" text-anchor="middle">02</text>
<text x="819" y="925" font-size="17" fill="#15263D" font-weight="600" text-anchor="start">Đúng trạng thái thiết bị</text>
<text x="770" y="954" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Không cấp mới tài sản đang sửa hoặc ngừng sử dụng.</text>
<text x="770" y="976" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Đổi trạng thái tuân thủ assignment hiện tại.</text>
<rect x="752" y="1016" width="636" height="110" rx="12" fill="#F5F8FD"/>
<rect x="770" y="1033" width="34" height="30" rx="9" fill="#E8EFFF"/>
<text x="787" y="1054" font-size="12" fill="#1D4ED8" font-weight="700" text-anchor="middle">03</text>
<text x="819" y="1053" font-size="17" fill="#15263D" font-weight="600" text-anchor="start">Đọc thông tin đúng phạm vi</text>
<text x="770" y="1082" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Link từ tài sản không mở rộng quyền đọc ticket.</text>
<text x="770" y="1104" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Requester không thấy lịch sử riêng tư của người khác.</text>
<rect x="752" y="1144" width="636" height="110" rx="12" fill="#F5F8FD"/>
<rect x="770" y="1161" width="34" height="30" rx="9" fill="#E8EFFF"/>
<text x="787" y="1182" font-size="12" fill="#1D4ED8" font-weight="700" text-anchor="middle">04</text>
<text x="819" y="1181" font-size="17" fill="#15263D" font-weight="600" text-anchor="start">Báo cáo và nhật ký</text>
<text x="770" y="1210" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Chỉ số dùng công thức thống nhất và dữ liệu nguồn.</text>
<text x="770" y="1232" font-size="13" fill="#52637A" font-weight="400" text-anchor="start">Không ghi mật khẩu, token hoặc dữ liệu bí mật vào log.</text>
<rect x="32" y="1362" width="1376" height="64" rx="12" fill="#EAF0F8"/>
