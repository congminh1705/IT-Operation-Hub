<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vietnamese type verification / v1.2</title><link rel="stylesheet" href="dashboard/prompt-dashboard/public/assets/fonts.css"><style>body{margin:0;padding:24px;background:#f5f4f8;color:#2b2344;font:16px/1.65 Inter,sans-serif;font-synthesis:none}main{max-width:1100px;margin:auto}section{background:white;border:1px solid #e0dbe8;padding:20px;margin:16px 0}h1{font:400 34px/1.4 Lora,serif}h2{font:600 16px Manrope,sans-serif}p{overflow-wrap:anywhere;margin:8px 0}.sample{font-size:24px;line-height:1.7}.note{font-size:14px;color:#6b6378}@media(max-width:540px){body{padding:16px}.sample{font-size:21px}h1{font-size:28px}}</style></head><body><main><h1>Kiểm tra phông chữ tiếng Việt</h1><p class="note">Đối chiếu dấu, chữ hoa/chữ thường và độ đậm thật — không ghép font trong tiêu đề.</p><div id="samples"></div><p id="result" class="note">Đang tải phông…</p></main><script>
const sample='Tiếp nhận yêu cầu · Điều phối nhân sự · Khả năng tiếp nhận · Phần mềm · Tài khoản · Quyền truy cập · Ưu tiên xử lý';
document.querySelector('#samples').innerHTML=['Lora','Inter','Manrope','Cabin'].map(name=>`<section><h2>${name}</h2>${[400,500,600,700].map(weight=>`<p class="sample" style="font-family:'${name}';font-weight:${weight}">${weight} — ${sample}</p>`).join('')}</section>`).join('');
document.fonts.ready.then(()=>{document.querySelector('#result').textContent='Đã tải font cục bộ. Kiểm tra cmap trong verify_fonts.py xác nhận đủ ký tự tiếng Việt và trục độ đậm.';document.documentElement.dataset.ready='true';});
</script></body></html>
