<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impeccable final layout checks</title><style>body{margin:0;font:14px/1.6 system-ui;background:#f5f4f8;color:#2b2344}.report{padding:20px}h1{font-size:22px}iframe{display:block;width:100%;height:900px;border:0}.pass{color:#25603c}.fail{color:#a73356}details{max-height:250px;overflow:auto}</style><div class="report"><h1>UI final — kiểm tra bố cục và font</h1><p id="summary">Đang kiểm tra…</p><details><summary>Kết quả từng màn</summary><ol id="results"></ol></details></div><iframe title="Màn đang kiểm tra"></iframe><script>
const f=document.querySelector('iframe');let pass=0,fail=0;const results=[];function report(name,ok){results.push({name,ok});ok?pass++:fail++;const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS ':'FAIL ')+name;document.querySelector('#results').append(li)}function load(url){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Timeout '+url)),12000);f.onload=()=>setTimeout(()=>{clearTimeout(timer);resolve(f.contentWindow)},150);f.src=url})}(async()=>{const items=await(await fetch('screen-gallery.json')).json();for(let i=0;i<items.length;i++){const item=items[i],url=new URL(item.url,location.href);url.searchParams.set('layoutCase',i);let w=await load(url.href);if(item.group==='dashboard'){for(let n=0;n<80;n++){const child=w.document.querySelector('iframe');if(child?.contentDocument?.querySelector('#main')){w=child.contentWindow;break}await new Promise(r=>setTimeout(r,50))}}const d=w.document;await d.fonts.ready;report(item.id+' content',!!d.querySelector('main,#main,.access-page'));if(item.screen==='login'){report('Login excluded from refinement',!d.body.classList.contains('format-v12'));continue}report(item.id+' shared stylesheet',Array.from(d.styleSheets).some(s=>s.href?.includes('layout-refinement.css')));const loadedFaces=await Promise.all([d.fonts.load('500 20px Lora'),d.fonts.load('600 18px Manrope')]);report(item.id+' local font',loadedFaces.every(faces=>faces.length>0)&&d.fonts.check('500 20px Lora')&&d.fonts.check('600 18px Manrope'));const h=d.querySelector('main h1,#main h1,.svg-review h1');if(h){const css=w.getComputedStyle(h);report(item.id+' heading scale',parseFloat(css.fontSize)<=30.1&&parseFloat(css.fontSize)>=25)}report(item.id+' viewport',d.documentElement.scrollWidth<=w.innerWidth+1);const samples=Array.from(d.querySelectorAll('.task h3,.task p,.lane>h2,.list-card h3,.list-card p,.dag .node'));const lum=c=>{const a=c.match(/[\d.]+/g)?.slice(0,3).map(Number);if(!a||a.length<3)return null;return a.map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}).reduce((sum,x,i)=>sum+x*[.2126,.7152,.0722][i],0)};if(samples.length)report(item.id+' legacy surface text contrast',samples.every(el=>{let parent=el,bg='';while(parent){bg=w.getComputedStyle(parent).backgroundColor;if(bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent')break;parent=parent.parentElement}const fg=lum(w.getComputedStyle(el).color),back=lum(bg);return fg!==null&&back!==null&&(Math.max(fg,back)+.05)/(Math.min(fg,back)+.05)>=4.5}));if(item.group==='05-ai'&&item.screen!=='policies'){const img=d.querySelector('.ai-canvas img');report(item.id+' readable static canvas',!!img&&(w.innerWidth>1100||img.getBoundingClientRect().width>=1280))}}document.querySelector('#summary').textContent=pass+' passed / '+fail+' failed'+(fail?' | '+results.filter(x=>!x.ok).map(x=>x.name).join(' ; '):'');document.body.dataset.result=fail?'FAIL':'PASS';window.layoutResults=results})().catch(e=>{document.querySelector('#summary').textContent='ERROR '+e.message;document.body.dataset.result='ERROR'});</script></html>
