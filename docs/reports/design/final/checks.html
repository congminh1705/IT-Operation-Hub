<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taste workspace checks</title><style>body{margin:0;font:14px/1.6 system-ui;background:#f5f4f8;color:#2b2344}.report{padding:20px}h1{font-size:22px}iframe{display:block;width:100%;height:900px;border:0}.pass{color:#25603c}.fail{color:#a73356}details{max-height:250px;overflow:auto}</style><div class="report"><h1>Taste UI review — kiểm tra bố cục và font</h1><p id="summary">Đang kiểm tra…</p><details><summary>Kết quả từng màn</summary><ol id="results"></ol></details></div><iframe title="Màn đang kiểm tra"></iframe><script>
const f=document.querySelector('iframe');let pass=0,fail=0;const results=[];function report(name,ok){results.push({name,ok});ok?pass++:fail++;const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS ':'FAIL ')+name;document.querySelector('#results').append(li)}function load(url){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Timeout '+url)),12000);f.onload=()=>setTimeout(()=>{clearTimeout(timer);resolve(f.contentWindow)},150);f.src=url})}(async()=>{const items=(await(await fetch('screen-gallery.json')).json()).filter(x=>x.screen!=='login'&&(!new URLSearchParams(location.search).get('only')||x.id.includes(new URLSearchParams(location.search).get('only'))));for(let i=0;i<items.length;i++){const item=items[i],url=new URL(item.url,location.href);url.searchParams.set('layoutCase',i);let w=await load(url.href);if(item.group==='dashboard'){for(let n=0;n<80;n++){const child=w.document.querySelector('iframe');if(child?.contentDocument?.querySelector('#main')){w=child.contentWindow;break}await new Promise(r=>setTimeout(r,50))}}const d=w.document;await d.fonts.ready;report(item.id+' content',!!d.querySelector('main,#main,.access-page'));if(item.screen==='login'){report('Login excluded from refinement',!d.body.classList.contains('format-v12'));continue}report(item.id+' Taste stylesheet',Array.from(d.styleSheets).some(s=>s.href?.includes('taste.css')));report(item.id+' Mac theme',d.body.classList.contains('taste-ui')&&Array.from(d.styleSheets).some(s=>s.href?.includes('mac.css')));report(item.id+' motion layer',Array.from(d.styleSheets).some(s=>s.href?.includes('assets/motion/motion.css')));if(item.id==='02-tickets-tickets'){const trigger=d.querySelector('.filters button');report(item.id+' modal trigger',!!trigger);if(trigger){trigger.click();const modal=d.querySelector('dialog[open]');report(item.id+' modal opens',!!modal);if(modal){report(item.id+' Mac modal radius',parseFloat(w.getComputedStyle(modal).borderRadius)>=16);const backdrop=w.getComputedStyle(modal,'::backdrop').backdropFilter;report(item.id+' backdrop '+backdrop+' reducedTransparency='+w.matchMedia('(prefers-reduced-transparency:reduce)').matches,backdrop.includes('blur')||w.matchMedia('(prefers-reduced-transparency:reduce)').matches);modal.close()}}}await new Promise(r=>setTimeout(r,180));const primary=d.querySelector('.btn.primary,.button:not(.secondary)');if(primary&&!primary.closest('.dispatch-panel'))report(item.id+' teal action '+w.getComputedStyle(primary).backgroundColor+' ['+primary.textContent.trim()+']',w.getComputedStyle(primary).backgroundColor==='rgb(8, 127, 120)');if(item.group==='dashboard'&&['manager','admin'].includes(item.screen)){const api=w.nightDispatch;report(item.id+' dispatch API',!!api);if(api){api.selectGroup('network');report(item.id+' group filters queue',api.snapshot().count===2);api.selectLayer('sla');report(item.id+' SLA layer filters queue',api.snapshot().count===1);api.selectLayer('requests');api.selectGroup(null)}}if(w.matchMedia('(prefers-reduced-motion:reduce)').matches){const button=d.querySelector('.btn,.button');if(button)report(item.id+' reduced motion',w.getComputedStyle(button).transitionDuration.split(',').every(v=>parseFloat(v)===0))}const titleNode=d.querySelector('main h1,#main h1');if(titleNode)report(item.id+' sans-serif heading',w.getComputedStyle(titleNode).fontFamily.includes('Inter'));const loadedFaces=await Promise.all([d.fonts.load('650 20px Manrope'),d.fonts.load('400 14px Inter')]);report(item.id+' local font',loadedFaces.every(faces=>faces.length>0)&&d.fonts.check('650 20px Manrope')&&d.fonts.check('400 14px Inter'));const h=d.querySelector('main h1,#main h1,.svg-review h1');if(h){const css=w.getComputedStyle(h);report(item.id+' heading scale',parseFloat(css.fontSize)<=30.1&&parseFloat(css.fontSize)>=25)}report(item.id+' viewport',d.documentElement.scrollWidth<=w.innerWidth+1);const samples=Array.from(d.querySelectorAll('.task h3,.task p,.lane>h2,.list-card h3,.list-card p,.dag .node'));const lum=c=>{const a=c.match(/[\d.]+/g)?.slice(0,3).map(Number);if(!a||a.length<3)return null;return a.map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}).reduce((sum,x,i)=>sum+x*[.2126,.7152,.0722][i],0)};if(samples.length)report(item.id+' legacy surface text contrast',samples.every(el=>{let parent=el,bg='';while(parent){bg=w.getComputedStyle(parent).backgroundColor;if(bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent')break;parent=parent.parentElement}const fg=lum(w.getComputedStyle(el).color),back=lum(bg);return fg!==null&&back!==null&&(Math.max(fg,back)+.05)/(Math.min(fg,back)+.05)>=4.5}));if(item.group==='05-ai'&&item.screen!=='policies'){const img=d.querySelector('.ai-canvas img');report(item.id+' readable static canvas',!!img&&(w.innerWidth>1100||img.getBoundingClientRect().width>=1280))}}document.querySelector('#summary').textContent=pass+' passed / '+fail+' failed'+(fail?' | '+results.filter(x=>!x.ok).map(x=>x.name).join(' ; '):'');document.body.dataset.result=fail?'FAIL':'PASS';window.layoutResults=results})().catch(e=>{document.querySelector('#summary').textContent='ERROR '+e.message;document.body.dataset.result='ERROR'});</script></html>
